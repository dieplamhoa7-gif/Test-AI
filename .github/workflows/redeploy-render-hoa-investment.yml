name: Redeploy hoa-investment Render backend

on:
  push:
    branches: [master]
    paths:
      - 'stock-news-backend/app/**'
      - 'stock-news-backend/*.py'
      - 'stock-news-backend/requirements*.txt'
      - 'stock-news-backend/render.yaml'
      - 'render.yaml'
      - '.github/workflows/redeploy-render-hoa-investment.yml'
  workflow_dispatch:

jobs:
  redeploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured, so Render was NOT redeployed."
            echo "Create a Render deploy hook for service hoa-investment and save it as this GitHub secret."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
