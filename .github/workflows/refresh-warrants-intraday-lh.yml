name: Refresh LH warrants intraday

on:
  schedule:
    # Mon-Fri, 09:00-15:00 ICT (UTC+7). GitHub cron uses UTC.
    - cron: '*/10 2-7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lh-warrants-intraday
  cancel-in-progress: false

jobs:
  refresh-warrants:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-news-backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh CW catalog and realtime cache
        run: |
          python build_warrant_catalog_cache.py
          python refresh_warrants_cache_lh.py

      - name: Verify fresh CW contract
        run: python verify_warrants_fresh.py

      - name: Commit and push fresh cache
        run: |
          git config user.name "LH Investment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/warrants/warrant_catalog.json firebase_public/data/warrants_data.json
          git diff --cached --quiet || git commit -m "Auto refresh LH warrants intraday cache"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Verify frontend locks before deploy
        run: |
          python verify_lh_final_version_lock.py
          python verify_lh_final_frontend_markers.py
          python verify_lh_news_format_lock.py

      - name: Deploy LHInvestment hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --project security-1c731 --config firebase.lhinvt.deploy.json --only hosting:lhinvt --token "$FIREBASE_TOKEN"
