<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strict by message project database</title><link rel="stylesheet" href="styles.css"><style>body{background:#07111f;color:#eaf2ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0}.wrap{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px;height:100vh}.side,.main{border:1px solid #24405f;border-radius:18px;background:#0d1a2c;overflow:auto}.side{padding:14px}.main{padding:18px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #31587f;background:#06111f;color:#fff;margin-bottom:12px}.item{display:block;width:100%;text-align:left;border:1px solid #24405f;background:#10243a;color:#eaf2ff;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}.item:hover,.item.active{border-color:#ffd166}.item b{display:block}.meta{font-size:12px;color:#9fb3c8;margin-top:4px}.excerpt{white-space:pre-wrap;color:#cbd8e8;line-height:1.55}.financial-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #24405f;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.12);margin:12px 0}.financial-table th,.financial-table td{padding:9px 10px;border-bottom:1px solid #24405f;vertical-align:top;font-size:13px;line-height:1.45}.financial-table thead th{background:rgba(255,209,102,.12);color:#ffe3a5;text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:left}.financial-table tbody th{width:34%;color:#ffd982;text-align:left;font-weight:900;background:rgba(255,209,102,.04)}.pill{display:inline-block;border:1px solid #31587f;border-radius:999px;padding:4px 8px;margin:3px;color:#9ee7ff;font-size:12px}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.side,.main{max-height:none}}</style></head><body><div class="wrap"><aside class="side"><h2>Strict records</h2><input id="q" class="search" placeholder="Tìm tên dự án, ngày, batch..."><div id="stats" class="meta"></div><div id="list"></div></aside><main class="main" id="detail"><h1>Chọn dự án</h1><p class="meta">Bản này tách theo từng tin nhắn/source_file trước, không merge tùm lum.</p></main></div><script src="strict_by_message_projects.js"></script><script>const data=window.STRICT_BY_MESSAGE_PROJECTS||[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let active=null;function fin(r){let a=[];try{a=JSON.parse(r.popup.financial_line_items||'[]')}catch(e){}if(!a.length)return '<p class="meta">Không có số liệu tài chính gắn nhãn.</p>';return '<table class="financial-table"><thead><tr><th>Mục</th><th>Giá trị</th></tr></thead><tbody>'+a.map(x=>`<tr><th>${esc(x.label)}</th><td>${esc(x.value)}</td></tr>`).join('')+'</tbody></table>'}function renderDetail(r){active=r.id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===r.id));detail.innerHTML=`<h1>${esc(r.name)}</h1><div><span class="pill">${esc(r.id)}</span><span class="pill">Ngày: ${esc(r.date||r.datetime_raw||'-')}</span><span class="pill">Source: ${esc(r.popup.source_files||'-')}</span><span class="pill">Sender: ${esc(r.sender||'-')}</span></div><h3>Tài chính — 2 cột Mục/Giá trị</h3>${fin(r)}<h3>Vị trí / map</h3><p>${esc(r.popup.location||'-')}</p>${r.map_url?`<p><a href="${esc(r.map_url)}" target="_blank">Google Maps gốc</a></p>`:''}<h3>Excerpt tin nhắn gốc</h3><div class="excerpt">${esc(r.popup.source_excerpt||r.excerpt)}</div>`}function render(){const q=document.getElementById('q').value.toLowerCase().trim();let arr=data.filter(r=>!q||[r.name,r.date,r.datetime_raw,r.popup.source_files,r.sender,r.popup.source_excerpt].join(' ').toLowerCase().includes(q));stats.textContent=`${arr.length}/${data.length} records · financial ${data.filter(x=>{try{return JSON.parse(x.popup.financial_line_items||'[]').length}catch(e){return false}}).length}`;list.innerHTML=arr.slice(0,500).map(r=>`<button class="item ${r.id===active?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span class="meta">${esc(r.date||r.datetime_raw||'-')} · ${esc(r.popup.source_files||'')}</span></button>`).join('');list.querySelectorAll('.item').forEach(b=>b.onclick=()=>renderDetail(data.find(x=>x.id===b.dataset.id)));}q.oninput=render;render();</script></body></html>
