<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Safe BDS Database</title><style>body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{display:grid;grid-template-columns:440px 1fr;gap:16px;padding:16px;height:100vh}.side,.main{border:1px solid #27405f;border-radius:18px;background:#0d1a2c;overflow:auto}.side{padding:14px}.main{padding:18px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #31587f;background:#06111f;color:#fff;margin-bottom:10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btn{border:1px solid #31587f;background:#10243a;color:#eaf2ff;border-radius:999px;padding:6px 10px;cursor:pointer}.btn.active{background:#ffd166;color:#07111f}.item{display:block;width:100%;text-align:left;border:1px solid #27405f;background:#10243a;color:#eaf2ff;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}.item.active,.item:hover{border-color:#ffd166}.item b{display:block}.meta{font-size:12px;color:#9fb3c8;margin-top:4px}.pill{display:inline-block;border:1px solid #31587f;border-radius:999px;padding:4px 8px;margin:3px;color:#9ee7ff;font-size:12px}.financial-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #27405f;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.12);margin:12px 0}.financial-table th,.financial-table td{padding:9px 10px;border-bottom:1px solid #27405f;vertical-align:top;font-size:13px;line-height:1.45}.financial-table thead th{background:rgba(255,209,102,.12);color:#ffe3a5;text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:left}.financial-table tbody th{width:28%;color:#ffd982;text-align:left;font-weight:900;background:rgba(255,209,102,.04)}.updates{display:grid;gap:10px}.upd{border:1px solid #27405f;border-radius:14px;padding:12px;background:#091827}.excerpt{white-space:pre-wrap;color:#cbd8e8;line-height:1.5;max-height:260px;overflow:auto}.warn{color:#ffd166}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}</style></head><body><div class="wrap"><aside class="side"><h2>Final Safe BDS DB</h2><input id="q" class="search" placeholder="Tìm tên dự án, ngày, batch, vị trí..."><div class="bar"><button class="btn active" data-mode="projects">Dự án</button><button class="btn" data-mode="review">Review mơ hồ</button><button class="btn" data-mode="merged">Có update</button><button class="btn" data-mode="financial">Có tài chính</button></div><div id="stats" class="meta"></div><div id="list"></div></aside><main class="main" id="detail"><h1>Chọn hồ sơ</h1><p class="meta">Final-safe: tách theo ngày/tên/vị trí; chỉ merge khi cùng dự án rõ. Tin mơ hồ nằm ở Review, không vào DB chính.</p></main></div><script src="final_safe_project_database.js"></script><script>const projects=window.FINAL_SAFE_PROJECTS||[], reviews=window.FINAL_REVIEW_MESSAGES||[];let mode='projects',active=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fin(r){let a=[];try{a=JSON.parse(r.popup.financial_line_items||'[]')}catch(e){}if(!a.length)return '<p class="meta">Không có tài chính gắn nhãn.</p>';return '<table class="financial-table"><thead><tr><th>Mục</th><th>Giá trị</th><th>Nguồn</th></tr></thead><tbody>'+a.map(x=>`<tr><th>${esc(x.label)}</th><td>${esc(x.value)}</td><td>${esc([x.date,x.source_id].filter(Boolean).join(' · '))}</td></tr>`).join('')+'</tbody></table>'}function detailProject(r){active=r.id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===r.id));const ups=r.popup.updates||[];detail.innerHTML=`<h1>${esc(r.name)}</h1><div><span class="pill">${esc(r.id)}</span><span class="pill">${esc(r.status)}</span><span class="pill">Updates: ${ups.length}</span><span class="pill">${esc(r.popup.first_report_date||'-')} → ${esc(r.popup.latest_report_date||'-')}</span><span class="pill">Priority: ${esc(r.priority)}</span></div>${r.map_url?`<p><a href="${esc(r.map_url)}" target="_blank">Google Maps gốc</a></p>`:''}<h3>Tài chính — Mục/Giá trị</h3>${fin(r)}<h3>Timeline tin cập nhật</h3><div class="updates">${ups.map(u=>`<div class="upd"><b>${esc(u.date||u.datetime_raw||'-')} · ${esc(u.source_file||'')}</b><div class="meta">${esc(u.id)} · ${esc(u.sender||'')}</div><div class="excerpt">${esc(u.excerpt||'')}</div></div>`).join('')}</div>`}function detailReview(r){active=r.id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===r.id));detail.innerHTML=`<h1 class="warn">Review: ${esc(r.name||'(không rõ tên)')}</h1><div><span class="pill">${esc(r.id)}</span><span class="pill">${esc(r.date||r.datetime_raw||'-')}</span><span class="pill">${esc(r.popup?.source_files||'')}</span></div><p class="warn">Tin này bị loại khỏi DB chính vì tên/vị trí chưa đủ rõ hoặc là comment/reply.</p><div class="excerpt">${esc(r.popup?.source_excerpt||r.excerpt||'')}</div>`}function current(){let arr=mode==='review'?reviews:projects;if(mode==='merged')arr=projects.filter(x=>(x.popup.update_count||0)>1);if(mode==='financial')arr=projects.filter(x=>{try{return JSON.parse(x.popup.financial_line_items||'[]').length}catch(e){return false}});const qv=q.value.toLowerCase().trim();if(qv)arr=arr.filter(r=>[r.name,r.date,r.datetime_raw,r.sender,r.status,r.priority,r.popup?.source_files,JSON.stringify(r.popup?.updates||[]),r.popup?.source_excerpt,r.excerpt].join(' ').toLowerCase().includes(qv));return arr}function render(){let arr=current();stats.textContent=`${arr.length} hiện · DB chính ${projects.length} · review ${reviews.length} · merged ${projects.filter(x=>(x.popup.update_count||0)>1).length} · financial ${projects.filter(x=>{try{return JSON.parse(x.popup.financial_line_items||'[]').length}catch(e){return false}}).length}`;list.innerHTML=arr.slice(0,700).map(r=>`<button class="item ${r.id===active?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.name||'(không rõ tên)')}</b><span class="meta">${esc(r.date||r.datetime_raw||'-')} · ${mode==='review'?esc(r.popup?.source_files||''):('updates '+(r.popup.update_count||1)+' · '+esc(r.status))}</span></button>`).join('');list.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const arr=current();const r=arr.find(x=>x.id===b.dataset.id);mode==='review'?detailReview(r):detailProject(r)})}document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active',x===b));active=null;render()});q.oninput=render;render();</script></body></html>
