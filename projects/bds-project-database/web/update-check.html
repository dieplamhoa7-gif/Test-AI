<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project update database</title><style>body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{display:grid;grid-template-columns:430px 1fr;gap:16px;padding:16px;height:100vh}.side,.main{border:1px solid #27405f;border-radius:18px;background:#0d1a2c;overflow:auto}.side{padding:14px}.main{padding:18px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #31587f;background:#06111f;color:#fff;margin-bottom:12px}.item{display:block;width:100%;text-align:left;border:1px solid #27405f;background:#10243a;color:#eaf2ff;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}.item.active,.item:hover{border-color:#ffd166}.item b{display:block}.meta{font-size:12px;color:#9fb3c8;margin-top:4px}.pill{display:inline-block;border:1px solid #31587f;border-radius:999px;padding:4px 8px;margin:3px;color:#9ee7ff;font-size:12px}.financial-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #27405f;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.12);margin:12px 0}.financial-table th,.financial-table td{padding:9px 10px;border-bottom:1px solid #27405f;vertical-align:top;font-size:13px;line-height:1.45}.financial-table thead th{background:rgba(255,209,102,.12);color:#ffe3a5;text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:left}.financial-table tbody th{width:28%;color:#ffd982;text-align:left;font-weight:900;background:rgba(255,209,102,.04)}.updates{display:grid;gap:10px}.upd{border:1px solid #27405f;border-radius:14px;padding:12px;background:#091827}.excerpt{white-space:pre-wrap;color:#cbd8e8;line-height:1.5;max-height:240px;overflow:auto}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}</style></head><body><div class="wrap"><aside class="side"><h2>Project update DB</h2><input id="q" class="search" placeholder="Tìm tên, ngày, source..."><label class="meta"><input id="mergedOnly" type="checkbox"> Chỉ hiện hồ sơ có nhiều update</label><div id="stats" class="meta"></div><div id="list"></div></aside><main class="main" id="detail"><h1>Chọn dự án</h1><p class="meta">Database build theo ngày tin nhắn + tên dự án; cùng dự án mới merge thành timeline update.</p></main></div><script src="project_update_database.js"></script><script>const data=window.PROJECT_UPDATE_DATABASE||[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let active=null;function items(r){let a=[];try{a=JSON.parse(r.popup.financial_line_items||'[]')}catch(e){}if(!a.length)return '<p class="meta">Không có số liệu tài chính gắn nhãn.</p>';return '<table class="financial-table"><thead><tr><th>Mục</th><th>Giá trị</th><th>Nguồn</th></tr></thead><tbody>'+a.map(x=>`<tr><th>${esc(x.label)}</th><td>${esc(x.value)}</td><td>${esc([x.date,x.source_id].filter(Boolean).join(' · '))}</td></tr>`).join('')+'</tbody></table>'}function renderDetail(r){active=r.id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===r.id));const ups=r.popup.updates||[];detail.innerHTML=`<h1>${esc(r.name)}</h1><div><span class="pill">${esc(r.id)}</span><span class="pill">Updates: ${ups.length}</span><span class="pill">First: ${esc(r.popup.first_report_date||'-')}</span><span class="pill">Latest: ${esc(r.popup.latest_report_date||'-')}</span><span class="pill">Status: ${esc(r.status)}</span></div><h3>Tài chính — Mục/Giá trị</h3>${items(r)}<h3>Timeline update theo tin nhắn</h3><div class="updates">${ups.map(u=>`<div class="upd"><b>${esc(u.date||u.datetime_raw||'-')} · ${esc(u.source_file||'')}</b><div class="meta">${esc(u.id)} · ${esc(u.sender||'')}</div><div class="excerpt">${esc(u.excerpt||'')}</div></div>`).join('')}</div>`}function render(){const qv=q.value.toLowerCase().trim();let arr=data.filter(r=>(!mergedOnly.checked||(r.popup.update_count||0)>1)&&(!qv||[r.name,r.date,r.datetime_raw,r.sender,r.popup.merge_key,JSON.stringify(r.popup.updates||[])].join(' ').toLowerCase().includes(qv)));stats.textContent=`${arr.length}/${data.length} hồ sơ · merged ${data.filter(x=>(x.popup.update_count||0)>1).length} · financial ${data.filter(x=>{try{return JSON.parse(x.popup.financial_line_items||'[]').length}catch(e){return false}}).length}`;list.innerHTML=arr.slice(0,600).map(r=>`<button class="item ${r.id===active?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span class="meta">${esc(r.popup.first_report_date||r.date||'-')} → ${esc(r.popup.latest_report_date||r.date||'-')} · updates ${r.popup.update_count||1} · ${esc(r.status)}</span></button>`).join('');list.querySelectorAll('.item').forEach(b=>b.onclick=()=>renderDetail(data.find(x=>x.id===b.dataset.id)));}q.oninput=render;mergedOnly.onchange=render;render();</script></body></html>
