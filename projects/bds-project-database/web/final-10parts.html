<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual 10 Parts BDS Database</title><style>body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{display:grid;grid-template-columns:450px 1fr;gap:16px;padding:16px;height:100vh}.side,.main{border:1px solid #27405f;border-radius:18px;background:#0d1a2c;overflow:auto}.side{padding:14px}.main{padding:18px}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #31587f;background:#06111f;color:#fff;margin-bottom:10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btn{border:1px solid #31587f;background:#10243a;color:#eaf2ff;border-radius:999px;padding:6px 10px;cursor:pointer}.btn.active{background:#ffd166;color:#07111f}.item{display:block;width:100%;text-align:left;border:1px solid #27405f;background:#10243a;color:#eaf2ff;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}.item.active,.item:hover{border-color:#ffd166}.item b{display:block}.meta{font-size:12px;color:#9fb3c8;margin-top:4px}.pill{display:inline-block;border:1px solid #31587f;border-radius:999px;padding:4px 8px;margin:3px;color:#9ee7ff;font-size:12px}.financial-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #27405f;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.12);margin:12px 0}.financial-table th,.financial-table td{padding:9px 10px;border-bottom:1px solid #27405f;vertical-align:top;font-size:13px;line-height:1.45}.financial-table thead th{background:rgba(255,209,102,.12);color:#ffe3a5;text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:left}.financial-table tbody th{width:30%;color:#ffd982;text-align:left;font-weight:900;background:rgba(255,209,102,.04)}.updates{display:grid;gap:10px}.upd{border:1px solid #27405f;border-radius:14px;padding:12px;background:#091827}.excerpt{white-space:pre-wrap;color:#cbd8e8;line-height:1.5;max-height:260px;overflow:auto}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.sum{border:1px solid #27405f;border-radius:10px;padding:7px;background:#091827;font-size:11px}@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><aside class="side"><h2>Manual 10 Parts DB</h2><input id="q" class="search" placeholder="Tìm tên, ngày, source, part..."><div class="bar"><button class="btn active" data-mode="records">Records</button><button class="btn" data-mode="review">Review</button><button class="btn" data-mode="merged">Merged</button><button class="btn" data-mode="financial">Financial</button></div><select id="partFilter" class="search"><option value="">Tất cả 10 phần</option></select><div id="stats" class="meta"></div><div id="partSummary" class="summary"></div><div id="list"></div></aside><main class="main" id="detail"><h1>Chọn hồ sơ</h1><p class="meta">Bản này xử lý theo 10 phần riêng, rồi mới đẩy vào database. Tin mơ hồ nằm ở Review.</p></main></div><script src="manual_10parts_final_database.js"></script><script>const DB=window.MANUAL_10PARTS_DB||{records:[],review:[],summary:[]};let mode='records',active=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));DB.summary.forEach(s=>partFilter.innerHTML+=`<option value="${s.part}">Part ${s.part}: ${s.records} records</option>`);function fin(r){const a=r.financial_items||[];if(!a.length)return '<p class="meta">Không có số liệu tài chính.</p>';return '<table class="financial-table"><thead><tr><th>Mục</th><th>Giá trị</th><th>Nguồn</th></tr></thead><tbody>'+a.map(x=>`<tr><th>${esc(x.label)}</th><td>${esc(x.value)}</td><td>${esc([x.date,'chunk '+x.chunk_id].filter(Boolean).join(' · '))}</td></tr>`).join('')+'</tbody></table>'}function detailRecord(r){active=r.id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===r.id));detail.innerHTML=`<h1>${esc(r.name)}</h1><div><span class="pill">${esc(r.id)}</span><span class="pill">Part ${r.part}</span><span class="pill">${esc(r.status)}</span><span class="pill">Updates ${r.update_count}</span><span class="pill">${esc(r.first_date||'-')} → ${esc(r.latest_date||'-')}</span></div>${r.map_url?`<p><a href="${esc(r.map_url)}" target="_blank">Google Maps gốc</a></p>`:''}<h3>Tài chính — Mục/Giá trị</h3>${fin(r)}<h3>Timeline update</h3><div class="updates">${(r.updates||[]).map(u=>`<div class="upd"><b>${esc(u.date||u.datetime||'-')} · ${esc(u.source_file||'')}</b><div class="meta">chunk ${esc(u.chunk_id)} · ${esc(u.sender||'')}</div><div class="excerpt">${esc(u.excerpt||'')}</div></div>`).join('')}</div>`}function detailReview(r){active='review-'+r.chunk_id;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.id===active));detail.innerHTML=`<h1>Review: ${esc(r.name_hint||'(không rõ tên)')}</h1><div><span class="pill">Part ${r.part}</span><span class="pill">chunk ${esc(r.chunk_id)}</span><span class="pill">${esc(r.report_date||r.report_datetime_raw||'-')}</span><span class="pill">${esc(r.source_file||'')}</span></div><p class="meta">Tin này chưa đẩy vào DB chính vì thiếu định danh dự án rõ hoặc là comment/reply.</p><div class="excerpt">${esc(r.excerpt||'')}</div>`}function arr(){let a=mode==='review'?DB.review:DB.records;if(mode==='merged')a=DB.records.filter(x=>x.update_count>1);if(mode==='financial')a=DB.records.filter(x=>(x.financial_items||[]).length);const pf=partFilter.value;if(pf)a=a.filter(x=>String(x.part)===pf);const qv=q.value.toLowerCase().trim();if(qv)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(qv));return a}function render(){const a=arr();stats.textContent=`${a.length} hiện · records ${DB.records.length} · review ${DB.review.length} · merged ${DB.records.filter(x=>x.update_count>1).length} · financial ${DB.records.filter(x=>(x.financial_items||[]).length).length}`;partSummary.innerHTML=DB.summary.map(s=>`<div class="sum"><b>Part ${s.part}</b><br>${s.records} rec · ${s.review} review<br>${s.merged} merged · ${s.financial} fin</div>`).join('');list.innerHTML=a.slice(0,800).map(r=>mode==='review'?`<button class="item" data-id="review-${esc(r.chunk_id)}"><b>${esc(r.name_hint||'(không rõ)')}</b><span class="meta">Part ${r.part} · chunk ${esc(r.chunk_id)} · ${esc(r.report_date||r.source_file||'')}</span></button>`:`<button class="item" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span class="meta">Part ${r.part} · ${esc(r.status)} · updates ${r.update_count} · ${esc(r.first_date||'-')}</span></button>`).join('');list.querySelectorAll('.item').forEach((b,i)=>b.onclick=()=>mode==='review'?detailReview(a[i]):detailRecord(a[i]));}document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active',x===b));render()});q.oninput=render;partFilter.onchange=render;render();</script></body></html>
