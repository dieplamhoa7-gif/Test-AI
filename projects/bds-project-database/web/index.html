<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BĐS Investment Map — Teams Database</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Danh sách dự án">
      <header class="brand-block">
        <div>
          <p class="eyebrow">Bee || Phân Tích Đầu Tư</p>
          <h1>BĐS Project Map</h1>
          <p class="subtitle">Map dự án từ Teams database — click bảng để bay tới marker, click marker để xem popup thông tin.</p>
        </div>
        <div class="metric-grid" id="metrics"></div>
      </header>

      <section class="controls" aria-label="Bộ lọc">
        <label class="search-box">
          <span>Tìm dự án / địa điểm / note</span>
          <input id="search" type="search" placeholder="VD: Thủ Đức, Cát Lái, Holiday Beach…" autocomplete="off" />
        </label>
        <div class="filter-row">
          <label>
            <span>Trạng thái</span>
            <select id="statusFilter"><option value="">Tất cả</option></select>
          </label>
          <label>
            <span>Loại</span>
            <select id="typeFilter"><option value="">Tất cả</option></select>
          </label>
        </div>
        <label class="sort-control">
          <span>Sắp xếp</span>
          <select id="sortMode">
            <option value="score">Score cao trước</option>
            <option value="date">Ngày mới trước</option>
            <option value="name">Tên A-Z</option>
          </select>
        </label>
      </section>

      <section class="table-card">
        <div class="table-head">
          <strong>Danh sách dự án có tọa độ</strong>
          <span id="countLabel"></span>
        </div>
        <div class="project-list" id="projectList" role="list"></div>
      </section>
    </aside>

    <main class="map-panel">
      <div class="topbar">
        <div>
          <p class="eyebrow">Interactive dashboard</p>
          <h2>Map & thông tin đầu tư</h2>
        </div>
        <div class="legend" aria-label="Chú giải">
          <span><i class="dot high"></i>High</span>
          <span><i class="dot medium"></i>Medium/Review</span>
          <span><i class="dot low"></i>Low</span>
        </div>
      </div>
      <div id="map" aria-label="Bản đồ dự án"></div>
      <div class="detail-drawer" id="detailDrawer" hidden></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="projects_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
