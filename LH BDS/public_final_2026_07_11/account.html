<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LH Real Estate · Duyệt truy cập</title>
  <style>
    :root{--navy:#071326;--gold:#c9a227;--line:#dbe4ef;--muted:#64748b;--bg:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,'Be Vietnam Pro',Segoe UI,Arial,sans-serif;background:var(--bg);color:#0f172a}
    header{background:linear-gradient(135deg,#071326,#0b1f3a);color:white;padding:20px 24px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 14px 40px rgba(2,6,23,.18)}
    .brand{display:flex;gap:14px;align-items:center}.brand img{width:96px;height:42px;object-fit:contain;background:white;border-radius:12px;padding:5px}.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0 0;color:#cbd5e1;font-size:13px}
    main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(15,23,42,.08);margin-bottom:16px}
    button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;margin:4px}.primary{background:var(--gold);color:#071326}.ghost{background:#e2e8f0;color:#0f172a}.danger{background:#ef4444;color:white}.ok{background:#16a34a;color:white}
    .status{white-space:pre-wrap;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:12px;color:#334155;margin-top:10px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;align-items:center;border-top:1px solid #eef2f7;padding:12px 0}.row:first-child{border-top:0}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#e2e8f0;font-size:12px;font-weight:800}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}@media(max-width:800px){.row{grid-template-columns:1fr}.actions{text-align:left}}
  </style>
</head>
<body>
<header>
  <div class="brand"><img src="assets/lh-logo.jpg" alt="LH Real Estate"><div><h1>Duyệt truy cập LH Real Estate</h1><p>Admin: dieplamhoa7@gmail.com</p></div></div>
  <div><button class="ghost" id="signout" style="display:none">Đăng xuất</button></div>
</header>
<main>
  <section class="card" id="loginCard">
    <h2>Đăng nhập admin</h2>
    <p>Đăng nhập bằng Google <b>dieplamhoa7@gmail.com</b> để xem và duyệt các tài khoản đang chờ.</p>
    <button class="primary" id="login">Tiếp tục với Google</button>
    <div class="status" id="status">Đang tải Firebase...</div>
  </section>
  <section class="card" id="adminCard" style="display:none">
    <h2>Yêu cầu truy cập</h2>
    <p class="muted">Bấm “Duyệt” xong người dùng quay lại trang web và bấm “Kiểm tra lại” hoặc refresh.</p>
    <div id="requests"></div>
  </section>
</main>
<script type="module">
const ADMIN_EMAIL='dieplamhoa7@gmail.com';
const CFG={apiKey:'AIzaSyCjUjwmRoWV1CoIy8IEU7-t0Uu8y24qkVg',authDomain:'hoa-investment.firebaseapp.com',projectId:'hoa-investment',storageBucket:'hoa-investment.firebasestorage.app',messagingSenderId:'364921999548',appId:'1:364921999548:web:09e201a8bd3471469d00b9'};
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getFirestore,collection,query,orderBy,onSnapshot,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const app=initializeApp(CFG,'lh-access-admin-v1');
const auth=getAuth(app); const db=getFirestore(app);
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(t){$('status').textContent=t}
$('login').onclick=async()=>{try{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,p)}catch(e){setStatus('Lỗi đăng nhập: '+(e.code||e.message||e))}};
$('signout').onclick=()=>signOut(auth);
function row(id,d){const st=d.approved===true||d.status==='approved'?'approved':(d.status||'pending');return `<div class="row"><div><b>${esc(d.email||'(không có email)')}</b><div class="muted">${esc(d.displayName||'')} · UID: ${esc(id)}</div></div><div><span class="pill ${esc(st)}">${esc(st)}</span><div class="muted">Page: ${esc(d.page||'')}</div></div><div class="muted">Last seen: ${d.lastSeenAt?.toDate?esc(d.lastSeenAt.toDate().toLocaleString('vi-VN')):'-'}</div><div class="actions"><button class="ok" data-act="approve" data-id="${esc(id)}">Duyệt</button><button class="danger" data-act="reject" data-id="${esc(id)}">Từ chối</button></div></div>`}
function listen(){const q=query(collection(db,'lh_access_requests'),orderBy('lastSeenAt','desc'));onSnapshot(q,snap=>{const docs=[];snap.forEach(x=>docs.push([x.id,x.data()||{}]));$('requests').innerHTML=docs.length?docs.map(([id,d])=>row(id,d)).join(''):'<p class="muted">Chưa có request.</p>';},e=>{$('requests').innerHTML='<div class="status">Lỗi đọc Firestore: '+esc(e.code||e.message||e)+'</div>'})}
$('requests').onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const id=b.dataset.id, act=b.dataset.act;try{await setDoc(doc(db,'lh_access_requests',id),{approved:act==='approve',status:act==='approve'?'approved':'rejected',reviewedBy:auth.currentUser?.email||'',reviewedAt:serverTimestamp()},{merge:true});}catch(err){alert('Lỗi cập nhật: '+(err.code||err.message||err))}};
onAuthStateChanged(auth,u=>{if(!u){$('loginCard').style.display='block';$('adminCard').style.display='none';$('signout').style.display='none';setStatus('Vui lòng đăng nhập.');return} $('signout').style.display='inline-block'; if((u.email||'').toLowerCase()!==ADMIN_EMAIL){$('loginCard').style.display='block';$('adminCard').style.display='none';setStatus('Tài khoản '+(u.email||'')+' không phải admin. Hãy đăng xuất và dùng '+ADMIN_EMAIL+'.');return} $('loginCard').style.display='none';$('adminCard').style.display='block';listen();});
</script>
</body>
</html>
