</head><body class="hightech">
<header class="top"><div class="inner"><div class="brand"><div class="logo"><img src="assets/lh-logo.jpg" alt="LH Real Estate logo"></div><div>LH Real Estate</div></div><nav class="nav"><a href="index.html">Tổng quan</a><a href="nvtc.html">NVTC</a><a href="quyhoach.html">Quy hoạch</a><a href="rd.html">R&D</a><a href="fs.html">FS</a><a href="tpre_flow_app.html">Pháp lý Đầu tư (đang phát triển)</a></nav></div></header><main class="wrap"><h1>Trạng thái hệ thống</h1><div id="out" class="card">Đang kiểm tra...</div></main><script>const CANDIDATES=['https://lh-realestate-api.lhrealestate.workers.dev'];async function check(base){const t=Date.now();try{const r=await fetch(base+'/health',{cache:'no-store'});const j=await r.json();return {base,ok:r.ok&&j.ok,ms:Date.now()-t,json:j}}catch(e){return {base,ok:false,error:e.message}}}Promise.all(CANDIDATES.map(check)).then(rows=>{out.innerHTML=rows.map(x=>'<div class="card"><b class="mono">'+x.base+'</b><br><span class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'ONLINE':'OFFLINE')+'</span> '+(x.ms?x.ms+'ms':'')+'<pre>'+JSON.stringify(x.json||x.error,null,2)+'</pre></div>').join('')})</script><script src="mojibake-cleaner.js"></script><script src="local-motion.js"></script>
