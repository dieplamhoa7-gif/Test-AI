<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LH Real Estate - Pháp lý & Đầu tư</title>
<link rel="stylesheet" href="app.css">
<style>
:root{--deep:#071526;--navy:#102542;--cyan:#38bdf8;--gold:#d5ad55;--line:#dbe4f0;--muted:#667085}
body{background:linear-gradient(135deg,#f6f8fb,#eef4ff);color:#102542}.wrap{max-width:1280px}.hero{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px}.hero-card{background:linear-gradient(135deg,#071526,#17345f 68%,#0e5f8f);color:white;border-radius:26px;padding:28px;box-shadow:0 22px 60px rgba(16,37,66,.18)}.hero-card h1{font-size:42px;line-height:1.08;margin:8px 0 10px}.hero-card p{color:#dbeafe;font-size:17px;max-width:920px}.eyebrow{display:inline-block;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);border-radius:999px;padding:7px 11px;color:#d9ecff;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;margin-top:16px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 32px rgba(16,37,66,.07)}textarea{min-height:150px;font-size:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.answer{white-space:pre-wrap;line-height:1.68;font-size:16px}.answer strong{color:#0f4c81;font-weight:900;background:#eef7ff;border-radius:5px;padding:0 2px}.law-table{width:100%;border-collapse:separate;border-spacing:0 8px}.law-table th{font-size:12px;text-align:left;color:#667085;padding:0 6px}.law-table td{vertical-align:top;background:#fbfdff;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:9px 6px;font-size:13px;line-height:1.4}.law-table td:first-child{border-left:1px solid #e5e7eb;border-radius:12px 0 0 12px}.law-table td:last-child{border-right:1px solid #e5e7eb;border-radius:0 12px 12px 0}.law-doc{font-weight:800;color:#17345f}.law-evi{max-height:88px;overflow:auto;color:#344054}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.badge.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.badge.ok{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.basis-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini-btn{border:1px solid #dbe4f0;background:white;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;color:#17345f;cursor:pointer}.mini-btn:hover{background:#eef7ff}.source-badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:900;margin-left:6px}.source-badge.full{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}.source-badge.note{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #dbe4f0;border-radius:999px;padding:8px 10px;background:#fff;cursor:pointer;color:#17345f;font-weight:700;font-size:13px}.small{font-size:13px;color:#667085}.kb-status{border:1px solid #bbf7d0;background:#ecfdf3;color:#14532d;border-radius:16px;padding:12px;margin-bottom:14px;font-size:13px;line-height:1.5}.kb-status code{background:white;border:1px solid #bbf7d0;border-radius:6px;padding:1px 5px}.status{display:none}.status.show{display:block}.status.run{background:#eef4ff;color:#194185}.status.ok{background:#ecfdf3;color:#166534}.status.err{background:#fdecec;color:#b42318}.list{margin:8px 0 0;padding-left:20px;line-height:1.55}@media(max-width:960px){.layout,.result-grid{grid-template-columns:1fr}.hero-card h1{font-size:34px}}
</style>
</head>
<body>
<header class="top"><div class="inner"><div class="brand"><div class="logo">LH</div><div>LH Real Estate</div></div><nav class="nav"><a href="index.html">Tổng quan</a><a href="nvtc.html">Nghĩa vụ tài chính</a><a href="quyhoach.html">Quy hoạch</a><a href="rd.html">R&D thị trường</a><a href="fs.html">FS hiệu quả dự án</a><a class="active" href="legal.html">Pháp lý & Đầu tư</a><a href="dossier.html">Hồ sơ dự án</a><a href="status.html">Status</a></nav></div></header>
<main class="wrap">
<section class="hero"><div class="hero-card"><span class="eyebrow">LH AI Luôn</span><h1>AI Luôn</h1></div></section>
<section class="panel"><h2>Câu hỏi</h2><textarea id="q" placeholder="Ví dụ: Dự án nhà ở hình thành trong tương lai cần điều kiện gì để mở bán?"></textarea><div class="chips"><button class="chip" onclick="setQ('Dự án nhà ở hình thành trong tương lai cần điều kiện gì để mở bán?')">Điều kiện mở bán</button><button class="chip" onclick="setQ('Điều kiện giao đất, cho thuê đất, chuyển mục đích sử dụng đất cho dự án BĐS là gì?')">Đất dự án</button><button class="chip" onclick="setQ('Thủ tục chấp thuận chủ trương đầu tư và lựa chọn nhà đầu tư dự án có sử dụng đất là gì?')">Đầu tư dự án</button><button class="chip" onclick="setQ('Tiền sử dụng đất, tiền thuê đất của dự án được xác định theo căn cứ nào?')">Tiền đất</button></div><div class="toolbar"><button class="btn" onclick="askLegal()">Hỏi AI pháp lý</button><button class="btn secondary" onclick="clearAll()">Xóa</button></div><div id="status" class="status"></div></section>
<section class="result-grid">
  <div class="panel"><h2>AI tóm tắt</h2><div id="answer" class="answer small">Chưa có câu hỏi.</div><div id="risks"></div><div id="next"></div></div>
  <div class="panel"><h2>Chi tiết thông tin luật</h2><p class="small">Nội dung điều/khoản chi tiết, đầy đủ để đối chiếu hồ sơ.</p><div class="basis-actions" style="margin-bottom:10px"><button class="mini-btn" onclick="filterBasis('all')">Tất cả</button><button class="mini-btn" onclick="filterBasis('law')">Luật</button><button class="mini-btn" onclick="filterBasis('decree')">Nghị định</button><button class="mini-btn" onclick="filterBasis('circular')">Thông tư</button><button class="mini-btn" onclick="filterBasis('resolution')">Nghị quyết</button><button class="mini-btn" onclick="filterBasis('local')">VB địa phương</button><button class="mini-btn" onclick="filterBasis('full')">Full-text</button><button class="mini-btn" onclick="filterBasis('note')">Notes cần kiểm chứng</button></div><div id="basisFilterInfo" class="small"></div><div id="basisDetail" class="answer small">Chưa có căn cứ.</div></div>
</section>
<div id="cites" style="display:none"></div><div id="sources" style="display:none"></div>
</main>
<script>
let API_BASE='https://journalists-regional-library-batch.trycloudflare.com';
const API_CANDIDATES=['https://journalists-regional-library-batch.trycloudflare.com','http://localhost:8787'];
async function ensureApiBase(){
  for(const b of API_CANDIDATES){try{const r=await fetch(b+'/health',{cache:'no-store'});const j=await r.json();if(r.ok&&j.ok){API_BASE=b;return b}}catch(e){}}
  return API_BASE;
}
const $ = id => document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mdInline(x){return esc(x).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function mdBlock(x){return mdInline(x).replace(/\n/g,'<br>')}
function setQ(x){$('q').value=x}
function clearAll(){
  $('q').value=''; $('basisDetail').textContent='Chưa có căn cứ.'; $('answer').innerHTML='Chưa có câu hỏi.';
  $('risks').innerHTML=''; $('next').innerHTML=''; $('status').className='status'; $('status').textContent='';
}
function listHtml(title, arr){if(!arr||!arr.length)return '';return '<h3>'+esc(title)+'</h3><ul class="list">'+arr.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</ul>'}
function formatSummary(items, fallback){
  if(!items||!items.length) return fallback||'';
  const lines=items.map((c,i)=>{
    const vb=c.title||c.sourcePath||'Văn bản';
    const date=c.date||c.issueDate||c.effectiveDate||'chưa rõ ngày trong nguồn nạp';
    const art=c.article?('Điều '+c.article):'Điều chưa xác định';
    const cl=c.clause?('khoản/điểm '+c.clause):'khoản/điểm chưa xác định';
    const nd=c.evidence||c.fullContent||c.content||'';
    return `${i+1}. ${art}, ${cl}, của ${vb}, ngày ${date}: ${nd}`;
  });
  return lines.join('\n\n') + (fallback?'\n\nKết luận tóm tắt:\n'+fallback:'');
}
function isFullSource(c){const p=String(c.sourcePath||c.title||'');return p.includes('official_texts_md_full')||p.includes('legal-ai-advisor:')}
function sourceBadge(c){return '<span class="source-badge '+(isFullSource(c)?'full':'note')+'">'+(isFullSource(c)?'Full-text/official':'Notes cần kiểm chứng')+'</span>'}
function docKind(c){const s=(String(c.title||'')+' '+String(c.sourcePath||'')).toLowerCase(); if(/nghi[_\s-]*quyet|nq[_\s-]*|hdnd|qh15/.test(s))return 'resolution'; if(/nghi[_\s-]*dinh|nd[_\s-]*|nd-cp/.test(s))return 'decree'; if(/thong[_\s-]*tu|tt[_\s-]/.test(s))return 'circular'; if(/ubnd|hdnd|bang[_\s-]*gia[_\s-]*dat|tp\.hcm|tphcm/.test(s))return 'local'; if(/luat|bo[_\s-]*luat/.test(s))return 'law'; return 'other'}
function kindLabel(k){return {law:'Luật',decree:'Nghị định',circular:'Thông tư',resolution:'Nghị quyết',local:'VB địa phương',other:'Khác'}[k]||k}
function filterBasis(kind){window.__basisFilter=kind||'all';renderBasisDetail(window.__legalCitations||[])}
function followBasis(kind, idx){const c=(window.__legalCitations||[])[idx];if(!c)return;const ref=[c.article?('Điều '+c.article):'',c.clause?('khoản '+c.clause):'',c.title||c.sourcePath||''].filter(Boolean).join(', ');const prompt={analyze:'Phân tích kỹ căn cứ này và áp dụng vào tình huống BĐS thực tế: ',compare:'So sánh căn cứ này với luật/nghị định/nghị quyết mới nhất liên quan: ',apply:'Áp dụng căn cứ này vào một dự án bất động sản cụ thể, nêu điều kiện, hồ sơ, rủi ro: '}[kind]||'Phân tích căn cứ này: ';$('q').value=prompt+ref;askLegal()}
function renderBasisDetail(items){
  window.__legalCitations=items||[];
  const all=items||[]; const kind=window.__basisFilter||'all';
  items=all.filter(c=>kind==='all'||(kind==='full'?isFullSource(c):(kind==='note'?!isFullSource(c):docKind(c)===kind)));
  if($('basisFilterInfo')) $('basisFilterInfo').innerHTML='Đang hiển thị <b>'+items.length+'</b>/<b>'+all.length+'</b> căn cứ' + (kind==='all'?'':' · bộ lọc: <b>'+esc(kindLabel(kind))+'</b>');
  if(!items||!items.length){$('basisDetail').textContent='Chưa có căn cứ phù hợp bộ lọc.';return}
  $('basisDetail').innerHTML=items.map((c,i)=>{
    const vb=c.title||c.sourcePath||'Văn bản';
    const date=c.date||c.issueDate||c.effectiveDate||'';
    const art=c.article?('Điều '+c.article):'Điều: chưa xác định';
    const cl=c.clause?('Khoản/điểm '+c.clause):'Khoản/điểm: chưa xác định';
    const year=c.year?('Năm '+c.year):'';
    const body=c.fullContent||c.content||c.evidence||'';
    const originalIndex=all.indexOf(c);
    return '<div class="law-card" style="border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin:8px 0;background:#fbfdff"><div class="law-doc">'+esc(i+1+'. '+vb)+(date?' - ngày '+esc(date):'')+(year?' - '+esc(year):'')+' <span class="badge ok">'+esc(kindLabel(docKind(c)))+'</span>'+sourceBadge(c)+'</div><div>- '+esc(art)+'</div><div>- '+esc(cl)+'</div><div class="law-evi">'+mdBlock(body)+'</div><div class="small">Nguồn: '+esc(c.sourcePath||'')+'</div><div class="basis-actions"><button class="mini-btn" onclick="followBasis(\'analyze\','+originalIndex+')">Phân tích điều này</button><button class="mini-btn" onclick="followBasis(\'compare\','+originalIndex+')">So sánh luật mới</button><button class="mini-btn" onclick="followBasis(\'apply\','+originalIndex+')">Áp dụng vào dự án</button></div></div>';
  }).join('');
}
async function askLegal(){await ensureApiBase();
  const question=$('q').value.trim();
  if(!question){$('status').className='status show err';$('status').textContent='Anh nhập câu hỏi trước.';return}
  $('status').className='status show run';
  $('status').textContent='AI đã nhận lệnh. Đang phân tích kỹ để trả lời chất lượng, ngắn gọn và có dẫn chứng điều/khoản...';
  $('answer').innerHTML='Đang xử lý...'; $('basisDetail').textContent='Đang tra chi tiết luật...';
  try{
    const r=await fetch(API_BASE+'/legal/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question,limit:8})});
    const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
    $('status').className='status show ok'; $('status').textContent='Đã trả lời theo format điều/khoản/văn bản/ngày/nội dung.';
    const items=j.citations||j.detailedBasis||[];
    renderBasisDetail(items); $('answer').innerHTML=mdBlock(j.answer||j.summary||formatSummary(items,''));
    $('risks').innerHTML=listHtml('Rủi ro / lưu ý',j.risks||[]); $('next').innerHTML=listHtml('Việc nên làm tiếp',j.nextSteps||[]);
  }catch(e){$('status').className='status show err';$('status').textContent='Lỗi: '+e.message;$('answer').innerHTML='Không gọi được AI pháp lý.'}
}
window.setQ=setQ; window.clearAll=clearAll; window.askLegal=askLegal; window.followBasis=followBasis; window.filterBasis=filterBasis;
</script>
</body>
</html>
