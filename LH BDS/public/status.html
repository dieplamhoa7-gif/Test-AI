<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LH Real Estate - System Status</title><link rel="stylesheet" href="app.css"><style>.ok{color:#166534}.bad{color:#b42318}.card{background:white;border:1px solid #dbe4f0;border-radius:18px;padding:18px;margin:14px 0}.mono{font-family:Consolas,monospace}</style></head><body><header class="top"><div class="inner"><div class="brand"><div class="logo">LH</div><div>System Status</div></div><nav class="nav"><a href="index.html">Tổng quan</a><a href="nvtc.html">NVTC</a><a href="rd.html">R&D</a><a href="legal.html">Legal</a></nav></div></header><main class="wrap"><h1>Trạng thái hệ thống</h1><div id="out" class="card">Đang kiểm tra...</div></main><script>const CANDIDATES=['https://engines-manufacturer-moving-chelsea.trycloudflare.com','http://localhost:8787'];async function check(base){const t=Date.now();try{const r=await fetch(base+'/health',{cache:'no-store'});const j=await r.json();return {base,ok:r.ok&&j.ok,ms:Date.now()-t,json:j}}catch(e){return {base,ok:false,error:e.message}}}Promise.all(CANDIDATES.map(check)).then(rows=>{out.innerHTML=rows.map(x=>'<div class="card"><b class="mono">'+x.base+'</b><br><span class="'+(x.ok?'ok':'bad')+'">'+(x.ok?'ONLINE':'OFFLINE')+'</span> '+(x.ms?x.ms+'ms':'')+'<pre>'+JSON.stringify(x.json||x.error,null,2)+'</pre></div>').join('')})</script></body></html>
