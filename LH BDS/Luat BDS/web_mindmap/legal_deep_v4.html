<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal Flow BĐS</title><style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10233b;--ink:#eef7ff;--muted:#9fb4cc;--line:rgba(255,255,255,.12);--cyan:#77d9ff;--gold:#f6c66b;--green:#8df0ba;--red:#ffadad;--violet:#c4b5fd}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;background:#07111f;color:var(--ink);min-height:100dvh;overflow-x:hidden}.aurora{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 18% 10%,rgba(119,217,255,.28),transparent 32%),radial-gradient(circle at 78% 18%,rgba(246,198,107,.18),transparent 28%),radial-gradient(circle at 55% 85%,rgba(141,240,186,.14),transparent 34%),linear-gradient(180deg,#07111f,#081522 52%,#050912)}.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 90%)}.app{max-width:1360px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:38px;height:38px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--gold));box-shadow:0 0 42px rgba(119,217,255,.28)}.pill{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:999px;padding:8px 11px;color:#d7edff;font-size:13px}.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:18px;align-items:stretch}@media(max-width:980px){.hero{grid-template-columns:1fr}}.left,.right{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.28);overflow:hidden}.left{min-height:calc(100dvh - 120px);display:flex;flex-direction:column}.head{padding:22px 24px;border-bottom:1px solid var(--line)}.crumbs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.crumb{border:1px solid rgba(119,217,255,.22);background:rgba(119,217,255,.07);color:#dff7ff;border-radius:999px;padding:6px 9px;font-size:12px;cursor:pointer}.crumb:hover{border-color:rgba(119,217,255,.65)}h1{font-size:clamp(30px,4vw,54px);line-height:.96;letter-spacing:-.055em;margin:0 0 12px}.summary{color:var(--muted);line-height:1.62;margin:0;font-size:16px}.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#eaf7ff;border-radius:14px;padding:10px 12px;cursor:pointer}.btn:hover{border-color:rgba(119,217,255,.55);background:rgba(119,217,255,.08)}.content{padding:18px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:720px){.cards{grid-template-columns:1fr}}.card{position:relative;min-height:180px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border-radius:24px;padding:18px;cursor:pointer;overflow:hidden;transition:.22s}.card:hover{transform:translateY(-4px);border-color:rgba(119,217,255,.65);box-shadow:0 16px 50px rgba(119,217,255,.08)}.card:before{content:"";position:absolute;right:-35px;bottom:-35px;width:150px;height:150px;border-radius:50%;background:rgba(119,217,255,.10);filter:blur(14px)}.type{display:inline-flex;align-items:center;gap:6px;background:rgba(246,198,107,.95);color:#07111f;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;text-transform:uppercase}.card h3{font-size:22px;line-height:1.08;margin:14px 0 10px;letter-spacing:-.025em}.card p{color:var(--muted);line-height:1.52;margin:0}.open{position:absolute;right:16px;bottom:14px;color:#dff7ff;font-weight:900}.detailGrid{display:grid;gap:14px}.box{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:20px;padding:15px}.box h3{margin:0 0 10px}.box li{margin:7px 0;color:#c8d9ec;line-height:1.5}.law{border-left:3px solid var(--gold);background:rgba(246,198,107,.08);border-radius:16px;padding:14px;margin:10px 0}.law h4{margin:0 0 5px}.src{font-family:Consolas,monospace;color:var(--green);font-size:12px}.law p{color:#d7e6f7;line-height:1.55}.quote{border-top:1px dashed rgba(255,255,255,.18);padding-top:9px;margin-top:9px;color:#cfe0f4;line-height:1.5}.right{min-height:calc(100dvh - 120px);display:flex;flex-direction:column}.flowHead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.flowHead h2{margin:0;font-size:18px}.flowCanvas{flex:1;position:relative;padding:18px;display:grid;place-items:center}.flowCanvas svg{width:100%;height:min(620px,calc(100dvh - 210px));min-height:420px}.link{stroke:rgba(119,217,255,.45);stroke-width:2;fill:none}.fnode rect{fill:rgba(255,255,255,.075);stroke:rgba(255,255,255,.18);stroke-width:1.4}.fnode.active rect{fill:rgba(246,198,107,.18);stroke:var(--gold);stroke-width:3}.fnode.child rect{fill:rgba(119,217,255,.09)}.fnode text{fill:#eef7ff;font-size:12px;font-weight:800}.fnode .sub{fill:#9fb4cc;font-size:10px;font-weight:600}.empty{border:1px dashed rgba(255,255,255,.18);border-radius:20px;padding:18px;color:var(--muted);text-align:center}.search{width:100%;border:1px solid var(--line);background:rgba(2,8,15,.72);color:var(--ink);border-radius:14px;padding:12px;margin-top:14px;outline:none}.search:focus{border-color:rgba(119,217,255,.7)}.footerNote{font-size:12px;color:#7f96b0;padding:12px 20px;border-top:1px solid var(--line)}</style></head><body><div class="aurora"></div><div class="grid"></div><div class="app"><div class="top"><div class="brand"><div class="logo"></div><span>LH BĐS Deep Legal Flow</span></div><div class="pill">Deep research • 182 căn cứ • drill-down</div></div><main class="hero"><section class="left"><div class="head"><div class="crumbs" id="crumbs"></div><h1 id="title"></h1><p class="summary" id="summary"></p><input class="search" id="search" placeholder="Tìm trong cấp hiện tại: đấu giá, đấu thầu, chủ trương, điều kiện đất..."/><div class="toolbar"><button class="btn" onclick="goHome()">Về tổng thể</button><button class="btn" onclick="goBack()">← Lùi một cấp</button></div></div><div class="content" id="content"></div></section><aside class="right"><div class="flowHead"><h2>Flowchart cấp hiện tại</h2><span class="pill" id="levelTag"></span></div><div class="flowCanvas"><svg id="flow" viewBox="0 0 720 560"></svg></div><div class="footerNote">Gợi ý: chọn node bên trái hoặc trên flowchart để drill-down. Trích dẫn điều luật nằm trong cấp detail cuối.</div></aside></main></div><script>
let DATA, current='root', history=[]; const esc=s=>(s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function node(id){return DATA.nodes.find(n=>n.id===id)}
function children(id){return DATA.nodes.filter(n=>n.parent===id)}
function boot(d){DATA=d; // enrich root children
 if(!children('root').length){DATA.nodes.find(n=>n.id==='housing').parent='root'} render()}
function path(id){let arr=[],n=node(id); while(n){arr.unshift(n); n=node(n.parent)} return arr}
function openNode(id){if(id===current)return; history.push(current); current=id; search.value=''; render()}
function goHome(){history.push(current); current='root'; search.value=''; render()}
function goBack(){if(history.length){current=history.pop(); search.value=''; render()} else {let p=node(current)?.parent; if(p)current=p; render()}}
function render(){const n=node(current)||node('root'); crumbs.innerHTML=path(current).map(p=>`<span class="crumb" onclick="openNode('${p.id}')">${esc(p.title.replace(/^P\d+\.\s*/,''))}</span>`).join(''); title.textContent=n.title; summary.textContent=n.summary||DATA.subtitle; levelTag.textContent=(n.type||'root').toUpperCase(); renderContent(); drawFlow()}
function renderContent(){const n=node(current), kids=children(current); const q=search.value.toLowerCase().trim(); const shown=kids.filter(k=>!q||JSON.stringify(k).toLowerCase().includes(q)); if(kids.length){content.innerHTML=`<div class="cards">${shown.map(k=>`<article class="card" onclick="openNode('${k.id}')"><span class="type">${esc(k.type||'node')}</span><h3>${esc(k.title.replace(/^P\d+\.\s*/,''))}</h3><p>${esc(k.summary)}</p><div class="open">Đi sâu →</div></article>`).join('')}</div>${!shown.length?'<div class="empty">Không thấy mục phù hợp trong cấp này.</div>':''}`; return}
 content.innerHTML=`<div class="detailGrid"><div class="box"><h3>Tóm tắt bước</h3><p class="summary">${esc(n.summary)}</p></div><div class="box"><h3>Câu hỏi/checkpoint</h3><ul>${(n.checkpoints||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Đối chiếu điều kiện áp dụng theo hồ sơ dự án cụ thể.</li>'}</ul></div><div class="box"><h3>Output cần chốt</h3><ul>${(n.outputs||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Checklist hồ sơ, cơ quan, thời hạn và văn bản đầu ra.</li>'}</ul></div><div class="box"><h3>Rủi ro chính</h3><ul>${(n.risks||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Cần legal review theo loại dự án, nguồn gốc đất và địa phương.</li>'}</ul></div><div class="box"><h3>Trích dẫn và tóm tắt điều luật</h3>${(n.legal_basis||[]).length?(n.legal_basis||[]).map(l=>`<div class="law"><h4>${esc(l.article)}</h4><div class="src">${esc(l.source_file)}</div><p><b>Tóm tắt:</b> ${esc(l.summary)}</p>${l.quote?`<details><summary>Mở trích dẫn nguồn</summary><div class="quote">${esc(l.quote)}</div></details>`:''}</div>`).join(''):'<div class="empty">Chưa gắn căn cứ cụ thể, cần bổ sung ở vòng refine.</div>'}</div></div>`}
function drawFlow(){const n=node(current), kids=children(current); const svg=flow; svg.innerHTML='<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="rgba(119,217,255,.7)"/></marker></defs>'; function el(name,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',name); for(const k in attrs)e.setAttribute(k,attrs[k]); return e} function link(x1,y1,x2,y2){svg.appendChild(el('path',{class:'link',d:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`,'marker-end':'url(#arr)'}))} function fnode(x,y,w,h,item,cls){const g=el('g',{class:'fnode '+cls,transform:`translate(${x},${y})`,style:'cursor:pointer'}); g.appendChild(el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:16})); const t=el('text',{'text-anchor':'middle',y:-3}); t.textContent=(item.title||'').replace(/^P\d+\.\s*/,'').slice(0,30); const s=el('text',{class:'sub','text-anchor':'middle',y:15}); s.textContent=(item.type||'node').toUpperCase(); g.appendChild(t); g.appendChild(s); g.onclick=()=>openNode(item.id); svg.appendChild(g)} const cx=360, cy=95; fnode(cx,cy,260,58,n,'active'); if(kids.length){const startY=210, gap=Math.min(86,280/Math.max(1,kids.length-1)); kids.forEach((k,i)=>{const y=kids.length===1?280:startY+i*gap; const x=kids.length>4?(i%2?500:220):360; link(cx,cy+30,x,y-32); fnode(x,y,240,58,k,'child')})} else { const p=node(n.parent); if(p){link(cx,cy+30,cx,250); fnode(cx,280,300,70,{id:p.id,title:'Quay lại: '+p.title,type:'parent'},'child')} }}
search.oninput=renderContent; fetch('legal_deep_v4.json').then(r=>r.json()).then(boot);
</script></body></html>
