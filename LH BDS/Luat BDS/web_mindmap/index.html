<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mindmap pháp lý BĐS</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--text:#eaf2ff;--muted:#9fb3c8;--line:#2d4d73;--accent:#7dd3fc;--hot:#fbbf24;--green:#86efac}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#102647,#07111f 55%);color:var(--text)}
header{position:sticky;top:0;z-index:2;background:rgba(7,17,31,.88);backdrop-filter:blur(10px);border-bottom:1px solid #20344e;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0}input{flex:1;min-width:220px;background:#081525;color:var(--text);border:1px solid #2a4666;border-radius:10px;padding:10px 12px}.badge{color:#06111f;background:var(--accent);border-radius:999px;padding:4px 9px;font-weight:700;font-size:12px}
main{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px}@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:rgba(13,27,46,.78);border:1px solid #203a58;border-radius:16px;padding:14px;box-shadow:0 10px 30px #0005}.hint{color:var(--muted);font-size:13px}
ul.tree{list-style:none;padding-left:0}.cat{margin:10px 0;border:1px solid #213b59;border-radius:12px;overflow:hidden}.cat>summary{cursor:pointer;padding:12px 14px;background:#0f2239;font-weight:800}.doc{padding:10px 12px;border-top:1px solid #1c334e;cursor:pointer}.doc:hover{background:#132a45}.doc .t{font-weight:700}.doc .m{font-size:12px;color:var(--muted);margin-top:3px}.doc mark{background:var(--hot);color:#111827;border-radius:3px}
#detail h2{margin-top:0;color:#bfdbfe}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #31587f;border-radius:999px;padding:4px 8px;color:#cfe7ff;font-size:12px}.heads{columns:2;column-gap:26px}.heads li{break-inside:avoid;margin:0 0 8px}.file{font-family:ui-monospace,Consolas,monospace;color:var(--green)}
svg{width:100%;height:68vh;min-height:520px;background:rgba(5,12,22,.5);border-radius:16px;border:1px solid #203a58}.node{cursor:pointer}.node circle{fill:#102b46;stroke:#7dd3fc;stroke-width:1.5}.node.root circle{fill:#fbbf24;stroke:#fde68a}.node.cat circle{fill:#1d4ed8}.node text{fill:#eaf2ff;font-size:12px}.link{stroke:#31587f;stroke-width:1.4;fill:none;opacity:.75}
</style></head><body><header><h1>Mindmap pháp lý BĐS</h1><span class="badge" id="count"></span><input id="q" placeholder="Tìm văn bản, chủ đề, điều khoản..."/><span class="hint">Click node hoặc văn bản để xem chi tiết</span></header><main><section class="panel"><div id="tree"></div></section><section><svg id="map"></svg><div class="panel" id="detail"><h2>Pháp lý BĐS Việt Nam</h2><p class="hint">Mindmap sinh từ toàn bộ file markdown trong thư mục nguồn. Có thể tìm kiếm và click từng văn bản để xem heading/điều mục trích xuất.</p></div></section></main>
<script>
let DATA=null, selected=null; const fmt=n=> new Intl.NumberFormat('vi-VN').format(n);
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderTree(filter=''){const root=document.getElementById('tree'); const f=filter.toLowerCase(); let html='<ul class="tree">'; for(const [cat,docs] of Object.entries(DATA.categories)){let ds=docs.filter(d=>!f||JSON.stringify(d).toLowerCase().includes(f)||cat.toLowerCase().includes(f)); if(!ds.length) continue; html+=`<li><details class="cat" open><summary>${esc(cat)} <span class="hint">${ds.length}</span></summary>`; for(const d of ds){let title=esc(d.title); html+=`<div class="doc" onclick="showDoc('${esc(d.file)}')"><div class="t">${title}</div><div class="m"><span class="file">${esc(d.file)}</span> · ${fmt(d.size)} bytes</div></div>`} html+='</details></li>'} root.innerHTML=html+'</ul>'}
function showDoc(file){const d=DATA.files.find(x=>x.file===file); if(!d)return; selected=file; document.getElementById('detail').innerHTML=`<h2>${esc(d.title)}</h2><p><span class="file">${esc(d.file)}</span> · ${fmt(d.size)} bytes</p><div class="chips">${d.categories.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><p class="hint">${esc(d.snippet)}</p><h3>Heading / điều mục chính</h3><ol class="heads">${(d.headings||[]).map(h=>`<li>${esc(h)}</li>`).join('')||'<li>Chưa trích xuất được heading rõ ràng</li>'}</ol>`; drawMap();}
function drawMap(){const svg=d3.select('#map'), w=svg.node().clientWidth, h=svg.node().clientHeight; svg.selectAll('*').remove(); const children=Object.entries(DATA.categories).map(([cat,docs])=>({name:cat,type:'cat',children:docs.slice(0,14).map(d=>({name:d.title.length>48?d.title.slice(0,48)+'…':d.title,type:'doc',file:d.file}))})); const root=d3.hierarchy({name:DATA.root,type:'root',children}); const tree=d3.tree().size([h-60,w-180]); tree(root); svg.append('g').attr('transform','translate(90,30)').selectAll('path').data(root.links()).join('path').attr('class','link').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x)); const g=svg.append('g').attr('transform','translate(90,30)').selectAll('g').data(root.descendants()).join('g').attr('class',d=>'node '+d.data.type).attr('transform',d=>`translate(${d.y},${d.x})`).on('click',(e,d)=>{if(d.data.file)showDoc(d.data.file)}); g.append('circle').attr('r',d=>d.data.type==='root'?9:d.data.type==='cat'?7:4).attr('stroke',d=>d.data.file===selected?'#fbbf24':null).attr('stroke-width',d=>d.data.file===selected?4:null); g.append('text').attr('dy','0.32em').attr('x',d=>d.children?-12:10).attr('text-anchor',d=>d.children?'end':'start').text(d=>d.data.name);}
fetch('mindmap_data.json').then(r=>r.json()).then(d=>{DATA=d; document.getElementById('count').textContent=d.count+' files'; renderTree(); drawMap(); addEventListener('resize',drawMap); document.getElementById('q').oninput=e=>renderTree(e.target.value)});
</script></body></html>
