<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lưu đồ đầu tư xây dựng dự án BĐS</title><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#172033;--muted:#667085;--line:#c9d4e5;--blue:#1967d2;--green:#2f9e44;--pink:#d63384;--amber:#f59f00;--purple:#7048e8;--red:#e03131;--shadow:0 16px 50px rgba(31,44,71,.14)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fbfcff 35%,#f6f8fb);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid #dde5f0;padding:12px 18px}.top h1{margin:0;font-size:22px;letter-spacing:-.02em}.top p{margin:4px 0 0;color:var(--muted)}.wrap{padding:18px;max-width:2100px;margin:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}.lg{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:13px;height:13px;border-radius:4px}.board{position:relative;overflow:auto;border:1px solid #d7e0ed;background:linear-gradient(#fff,#f8fbff);border-radius:22px;box-shadow:var(--shadow);padding:18px}.flow{position:relative;display:grid;grid-template-columns:repeat(11, minmax(180px,1fr));grid-auto-rows:minmax(104px,auto);gap:22px 28px;min-width:1980px}.laneLabel{position:sticky;left:0;z-index:5;align-self:stretch;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#334155;background:#eef4ff;border:1px solid #d5e0ee;border-radius:14px;font-size:11px}.node{position:relative;border:2px solid var(--blue);border-radius:14px;background:var(--paper);padding:10px;box-shadow:0 10px 28px rgba(25,103,210,.08);cursor:pointer;min-height:98px;transition:.18s;overflow:hidden}.node:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(25,103,210,.18)}.node:after{content:"";position:absolute;right:-31px;top:50%;width:30px;border-top:3px solid #2b6cb0}.node:last-child:after{display:none}.node .code{display:inline-block;background:#0b3d91;color:white;border-radius:7px;padding:3px 7px;font:900 11px ui-monospace,monospace}.node h3{margin:8px 0 6px;font-size:14px;line-height:1.22}.node p{margin:0;color:#475467;font-size:12px}.legal{border-color:var(--green);background:#f4fff7}.design{border-color:var(--purple);background:#f8f5ff}.construct{border-color:var(--amber);background:#fff9ed}.business{border-color:var(--pink);background:#fff5fa}.handover{border-color:#15aabf;background:#f2fcff}.support{border-style:dashed;border-color:#64748b;background:#f8fafc}.subgrid{display:grid;gap:9px}.small{min-height:72px;border-width:1.5px}.small:after{display:none}.phaseHead{grid-row:1}.lane2{grid-row:2}.lane3{grid-row:3}.lane4{grid-row:4}.lane5{grid-row:5}.lane6{grid-row:6}.lane7{grid-row:7}.col1{grid-column:1}.col2{grid-column:2}.col3{grid-column:3}.col4{grid-column:4}.col5{grid-column:5}.col6{grid-column:6}.col7{grid-column:7}.col8{grid-column:8}.col9{grid-column:9}.col10{grid-column:10}.col11{grid-column:11}.modal{position:fixed;inset:0;display:none;z-index:99;background:rgba(10,18,32,.58);padding:28px;overflow:auto}.modal.open{display:block}.dialog{max-width:1120px;margin:0 auto;background:white;border-radius:24px;box-shadow:0 30px 110px rgba(0,0,0,.35);overflow:hidden}.dlgTop{padding:22px 26px;background:linear-gradient(135deg,#0b3d91,#1c7ed6);color:white;position:relative}.close{position:absolute;right:18px;top:14px;border:0;background:rgba(255,255,255,.16);color:white;border-radius:999px;width:38px;height:38px;font-size:22px;cursor:pointer}.dlgTop h2{margin:8px 48px 4px 0;font-size:28px;letter-spacing:-.04em}.dlgTop .meta{opacity:.9}.dlgBody{padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{border:1px solid #e2e8f0;border-radius:16px;padding:14px;background:#fff}.section.full{grid-column:1/-1}.section h4{margin:0 0 10px;color:#0b3d91;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.line{padding:8px 0;border-bottom:1px solid #eef2f7}.line:last-child{border-bottom:0}.law{border:1px solid #dbeafe;border-radius:16px;margin:12px 0;padding:14px;background:#f8fbff}.lawHead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.doc{background:#0b3d91;color:white;border-radius:9px;padding:5px 8px;font:900 12px ui-monospace,monospace}.article{background:#fff3bf;color:#5f3f00;border-radius:9px;padding:5px 8px;font-weight:800;font-size:12px}.source{color:#667085;font-size:12px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #cfe0f5;background:white;border-radius:999px;padding:8px 11px;cursor:pointer;color:#0b3d91;font-weight:800}.btn:hover{background:#edf6ff}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px}.summaryBox{border:1px solid #cfe0f5;background:linear-gradient(180deg,#f8fbff,#fff);border-radius:18px;padding:16px;grid-column:1/-1}.summaryBox b{color:#0b3d91}.dossier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;grid-column:1/-1}.mini{border:1px solid #e2e8f0;border-radius:16px;background:#fff;padding:14px}.mini h4{margin:0 0 8px;text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:#0b3d91}.mini .line{font-size:13px}.lawGrid{display:grid;gap:14px}.law{background:linear-gradient(180deg,#f8fbff,#fff)}.lawPoint{display:grid;grid-template-columns:190px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #eef2f7}.lawPoint:last-child{border-bottom:0}.lawLabel{font-weight:900;color:#0b3d91;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.lawText{color:#24324a}.sourceBlock{margin-top:10px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:10px;color:#475569;font-size:12px}.toc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.toc span{background:#eef6ff;color:#0b3d91;border:1px solid #cfe0f5;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
@media(max-width:900px){.dossier{grid-template-columns:1fr}.lawPoint{grid-template-columns:1fr;gap:3px}}
@media(max-width:900px){.dlgBody{grid-template-columns:1fr}.modal{padding:10px}.top h1{font-size:18px}}
</style></head><body><header class="top"><h1>Lưu đồ đầu tư xây dựng dự án BĐS</h1><p>Thiết kế theo bản lưu đồ TPRE: bấm từng ô để mở popup luật liên quan, quy trình, thời gian, điều kiện, lưu ý và nguồn điều/khoản.</p></header><main class="wrap"><div class="legend"><span class="lg"><i class="dot" style="background:#f4fff7;border:2px solid #2f9e44"></i>Pháp lý/đất</span><span class="lg"><i class="dot" style="background:#f8f5ff;border:2px solid #7048e8"></i>Thiết kế</span><span class="lg"><i class="dot" style="background:#fff9ed;border:2px solid #f59f00"></i>Thi công</span><span class="lg"><i class="dot" style="background:#fff5fa;border:2px solid #d63384"></i>Kinh doanh</span><span class="lg"><i class="dot" style="background:#f2fcff;border:2px solid #15aabf"></i>Bàn giao/cấp sổ</span></div><section class="board"><div class="flow" id="flow"></div></section></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dlgTop"><button class="close" onclick="closeModal()">×</button><div id="mcode"></div><h2 id="mtitle"></h2><div class="meta" id="mmeta"></div></div><div class="dlgBody" id="mbody"></div></div></div><script>
let DATA, ALL=[];const layout={I:['col1','legal'],II:['col2','support'],III:['col3','legal'],IV:['col4','design'],V:['col5','legal'],VI:['col6','design'],VII:['col7','construct'],VIII:['col8','business'],IX:['col9','construct'],X:['col10','handover'],XI:['col11','handover']};
fetch('tpre_bds_flow.json').then(r=>r.json()).then(d=>{DATA=d;build()});
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function lines(a){return (a&&a.length?a:['Chưa có dữ liệu — sẽ bổ sung khi tách node chi tiết từ PDF.']).map(x=>`<div class="line">${esc(x)}</div>`).join('')}
function cls(id){return (layout[id]||['col1','legal']).join(' ')}
function build(){const f=document.getElementById('flow');ALL=[];DATA.phases.forEach((p,idx)=>{const [col,type]=layout[p.id]||['col1','legal']; const it=p.items&&p.items[0]||p; ALL.push({phase:p,item:it}); f.insertAdjacentHTML('beforeend',`<div class="node phaseHead ${col} ${type}" onclick="openNode(${ALL.length-1})"><span class="code">${esc(p.id)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p></div>`);});
 // lane/detail nodes approximating PDF subboxes
 const subs=[['I','lane2','I-I.1','Kiểm tra hiện trạng khu đất / Legal DD','support'],['I','lane3','I-O.1','Product brief / cấu trúc pháp lý chính','support'],['II','lane2','II-I.1','Bản đồ ranh đất, hiện trạng, danh sách chủ đất','support'],['II','lane3','II-O.1','Phương án bồi thường, GPMB, TĐC','legal'],['III','lane2','III-I.1','Hồ sơ năng lực NĐT / pháp lý đất đai','support'],['III','lane3','III-O.1','CTCTĐT, công nhận CĐT, ký quỹ','legal'],['IV','lane2','IV-I.1','Nhiệm vụ QHCT / thiết kế ý tưởng','design'],['IV','lane3','IV-O.1','Phê duyệt QHCT 1/500 / QLXD theo đồ án','design'],['V','lane2','V-I.1','Bản đồ HTVT, cắm mốc, bàn giao ranh','support'],['V','lane3','V-O.1','QĐ giao/thuê đất, giá đất, nghĩa vụ tài chính','legal'],['V','lane4','V-O.2','GCN QSDĐ dự án','legal'],['VI','lane2','VI-I.1','TKCS/BCNCKT, TKKT/TKBVTC, khảo sát','design'],['VI','lane3','VI-O.1','ĐTM/GPMT, PCCC, đấu nối HTKT','design'],['VI','lane4','VI-O.2','GPXD và thông báo khởi công','design'],['VII','lane2','VII-I.1','Thi công san nền, HTKT, phần ngầm/thân','construct'],['VII','lane3','VII-O.1','Nghiệm thu giai đoạn / hồ sơ hoàn công','construct'],['VIII','lane2','VIII-I.1','Mẫu HĐMB, bảo lãnh, nghiệm thu mốc','business'],['VIII','lane3','VIII-O.1','Thông báo đủ điều kiện bán HTTTL','business'],['IX','lane2','IX-I.1','Nghiệm thu PCCC, môi trường, chất lượng','construct'],['IX','lane3','IX-O.1','Văn bản kiểm tra nghiệm thu đưa vào sử dụng','construct'],['X','lane2','X-I.1','Bản vẽ phân lô, sơ đồ nhà đất, hồ sơ cấp GCN','handover'],['X','lane3','X-O.1','Bàn giao nhà / cấp GCN cho khách hàng','handover'],['XI','lane2','XI-I.1','Bảo hành, vận hành, hậu kiểm','handover']];
 subs.forEach(s=>{const p=DATA.phases.find(x=>x.id===s[0]); const it=p.items[0]; const obj={phase:p,item:{...it,code:s[2],title:s[3],summary:'Node chi tiết theo mã lưu đồ PDF. Nội dung pháp lý kế thừa từ mốc chính và sẽ tiếp tục được tách sâu theo hồ sơ/thủ tục riêng.',owner:p.lane}}; ALL.push(obj); const [col]=layout[s[0]]; f.insertAdjacentHTML('beforeend',`<div class="node small ${s[1]} ${col} ${s[4]}" onclick="openNode(${ALL.length-1})"><span class="code">${esc(s[2])}</span><h3>${esc(s[3])}</h3></div>`)});
}
function openNode(i){const o=ALL[i], it=o.item, p=o.phase; mcode.innerHTML=`<span class="code">${esc(it.code||p.id)}</span>`; mtitle.textContent=it.title||p.title; mmeta.textContent=`Lane: ${it.owner||p.lane} · Phase ${p.id}: ${p.title}`; mbody.innerHTML=`<div class="summaryBox"><b>Mục tiêu thủ tục:</b> ${esc(it.summary||p.summary)}<div class="toc"><span>1. Quy trình</span><span>2. Hồ sơ/điều kiện</span><span>3. Thời gian</span><span>4. Kết quả</span><span>5. Căn cứ pháp lý</span></div></div><div class="dossier"><div class="mini"><h4>Quy trình / việc phải làm</h4>${lines(it.inputs)}</div><div class="mini"><h4>Điều kiện & checkpoint</h4>${lines(checkFor(p.id))}</div><div class="mini"><h4>Thời gian thực hiện</h4>${lines(timelineFor(p.id))}</div></div><div class="section full"><h4>Kết quả / output pháp lý</h4>${lines(it.outputs)}</div><div class="section full"><h4>Luật liên quan — tóm tắt trước, nguồn điều/khoản sau</h4><div class="lawGrid">${laws(it.legal_basis)}</div></div>`; modal.classList.add('open')}
function timelineFor(id){return {
I:['Bước 1: thu thập hồ sơ đất, quy hoạch, pháp lý chủ đất/dự án, thông tin thị trường và hạn chế pháp lý hiện hữu.','Bước 2: dựng ma trận route đầu tư/đất: đấu giá, đấu thầu, chấp thuận NĐT, tự có đất, M&A/chuyển nhượng dự án.','Bước 3: lập product brief, tổng tiến độ sơ bộ, ngân sách dự án/TMĐT, phân kỳ đầu tư và danh mục rủi ro cần xử lý trước khi đặt cọc.','Thời gian tham khảo nội bộ: 1–4 tuần nếu hồ sơ tương đối đầy đủ; dự án M&A/pháp lý phức tạp có thể lâu hơn.'],
II:['Bước 1: xác lập ranh dự án, hiện trạng sử dụng đất, chủ sử dụng, tài sản trên đất và hồ sơ GCN.','Bước 2: lựa chọn cơ chế GPMB: Nhà nước thu hồi đất, tự thỏa thuận nhận QSDĐ, hoán đổi/điều chỉnh đất công hoặc M&A.','Bước 3: lập/ thẩm định phương án bồi thường, hỗ trợ, tái định cư, kế hoạch vốn và lịch chi trả.','Bước 4: hoàn tất kiểm đếm, bồi thường, chỉnh lý hồ sơ địa chính và xác nhận hoàn thành GPMB theo phân kỳ.','Thời gian: thường là đường găng, phụ thuộc số lượng hộ dân, khiếu nại, đất công/xen kẹt và ngân sách bồi thường.'],
III:['Bước 1: xác định dự án thuộc diện CTCTĐT/CTNĐT và thẩm quyền chấp thuận.','Bước 2: chuẩn bị hồ sơ năng lực NĐT, tài liệu đất đai, mục tiêu/quy mô/tiến độ, sơ bộ phương án thiết kế và tổng vốn.','Bước 3: xử lý song song các văn bản nền: kế hoạch nhà ở, kế hoạch sử dụng đất, đấu nối/giao thông/PCCC/môi trường nếu cần.','Bước 4: nhận quyết định CTCTĐT/CTNĐT, công nhận/chấp thuận CĐT và thực hiện ký quỹ/bảo đảm dự án.','Thời gian: phụ thuộc thẩm quyền, hình thức chọn NĐT và mức độ đầy đủ của quy hoạch/đất/hồ sơ năng lực.'],
IV:['Bước 1: kiểm tra quy hoạch cấp trên, chỉ tiêu quy hoạch, chỉ tiêu dân số, hạ tầng và ràng buộc kiến trúc.','Bước 2: lập nhiệm vụ QHCT hoặc quy hoạch tổng mặt bằng; tổ chức thiết kế ý tưởng/design brief.','Bước 3: lập đồ án QHCT 1/500, lấy ý kiến, thẩm định và trình phê duyệt.','Bước 4: phê duyệt quy định quản lý xây dựng theo đồ án; cập nhật bản đồ hiện trạng/cắm mốc phục vụ đất và thiết kế.','Thời gian: phụ thuộc quy hoạch cấp trên, số vòng góp ý, yêu cầu điều chỉnh chỉ tiêu và thẩm quyền phê duyệt.'],
V:['Bước 1: chuẩn bị bản đồ HTVT, cắm mốc, QHCT, hồ sơ GPMB và hồ sơ giao/thuê đất/chuyển mục đích.','Bước 2: nộp/hoàn thiện hồ sơ quyết định giao đất, thuê đất hoặc chuyển mục đích sử dụng đất theo route đã chọn.','Bước 3: tổ chức xác định giá đất, chứng thư/thẩm định giá, trình phê duyệt giá đất và thông báo nghĩa vụ tài chính.','Bước 4: hoàn tất nộp tiền, xác nhận nghĩa vụ tài chính và cấp GCN QSDĐ dự án.','Thời gian: phải tách riêng timeline quyết định đất và timeline xác định giá đất/nghĩa vụ tài chính; đây thường là điểm nghẽn lớn.'],
VI:['Bước 1: khảo sát địa hình, địa chất, hạ tầng ngầm, công trình lân cận; lập TKCS/BCNCKT.','Bước 2: xin ý kiến/thẩm định TKCS, giải pháp PCCC, đấu nối hạ tầng, giao thông, cấp điện, cấp nước, thoát nước.','Bước 3: lập TKKT/TKBVTC, thẩm tra/thẩm định thiết kế, thẩm duyệt PCCC, hoàn thiện ĐTM/GPMT.','Bước 4: xin GPXD, thông báo khởi công và kiểm soát điều kiện khởi công.','Thời gian: các thủ tục kỹ thuật phải chạy song song; thiếu PCCC/môi trường/đấu nối sẽ kéo chậm GPXD và nghiệm thu.'],
VII:['Bước 1: tổ chức thi công theo GPXD/TKBVTC: san nền, HTKT, phần ngầm, phần thân, hoàn thiện, tiện ích/cảnh quan.','Bước 2: quản lý hồ sơ chất lượng: nhật ký, vật liệu, thí nghiệm, biên bản nghiệm thu giai đoạn, bản vẽ hoàn công.','Bước 3: nghiệm thu các mốc HTKT/phần móng/phần ngầm tương ứng với điều kiện bán hàng và nghiệm thu hoàn thành.','Thời gian: theo tiến độ xây dựng/phân kỳ; hồ sơ chất lượng phải lập từ đầu, không gom cuối dự án.'],
VIII:['Bước 1: kiểm tra điều kiện bán/huy động vốn theo từng loại sản phẩm: thấp tầng, cao tầng, căn hộ, HTKT, HTTTL.','Bước 2: chuẩn bị mẫu HĐMB, bảo lãnh ngân hàng, hồ sơ công khai thông tin dự án, bản vẽ sản phẩm và tiến độ thanh toán.','Bước 3: hoàn tất nghiệm thu mốc bắt buộc như HTKT/phần móng/phần ngầm tùy sản phẩm.','Bước 4: gửi/nhận thông báo đủ điều kiện bán và triển khai marketing, bán hàng, ký HĐMB.','Thời gian: không lấy theo kế hoạch marketing; phải khóa theo mốc nghiệm thu và văn bản đủ điều kiện bán.'],
IX:['Bước 1: nghiệm thu hoàn thành với nhà thầu, tư vấn giám sát và CĐT; hoàn thiện hồ sơ hoàn công/chất lượng.','Bước 2: nghiệm thu PCCC, môi trường/GPMT/vận hành thử XLNT nếu thuộc diện.','Bước 3: đề nghị CQNN kiểm tra công tác nghiệm thu và xác nhận đủ điều kiện đưa công trình vào sử dụng.','Thời gian: phụ thuộc độ sạch của hồ sơ hoàn công, PCCC, môi trường, đấu nối và tồn tại hiện trường.'],

function splitPoint(x){let m=String(x||'').match(/^([^:]{3,45}):\s*(.*)$/);return m?{label:m[1],text:m[2]}:{label:'Nội dung chính',text:x}}
function laws(a){return (a||[]).map(l=>`<div class="law"><div class="lawHead"><span class="doc">${esc(l.doc)}</span><span class="article">${esc(l.article)}</span></div>${(l.points||[]).map(x=>{const p=splitPoint(x);return `<div class="lawPoint"><div class="lawLabel">${esc(p.label)}</div><div class="lawText">${esc(p.text)}</div></div>`}).join('')}<div class="sourceBlock"><b>Nguồn cuối mục:</b> ${esc(l.source_file||'local corpus')} · ${esc(l.article||'đang cập nhật điều/khoản/điểm')}</div></div>`).join('')||'<div class="line">Chưa map căn cứ.</div>'}
function closeModal(){modal.classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
