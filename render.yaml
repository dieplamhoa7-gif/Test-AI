services:
  - type: web
    name: lh-realestate-browser-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NVTC_PROXY_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: NINEROUTER_BDS_MODEL
        value: APIBDS
      - key: NINEROUTER_MODEL
        value: APIBDS
      - key: BDS_BROWSER_PROFILE
        value: /tmp/lh-bds-browser-profile
