services:
  - type: web
    name: lh-realestate-browser-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NVTC_PROXY_PORT
        value: 10000
      - key: PORT
        value: 10000
      - key: NINEROUTER_BDS_MODEL
        value: APIBDS
      - key: NINEROUTER_MODEL
        value: APIBDS
      - key: ROUTER9_BASE_URL
        value: http://100.89.47.25:20128/v1
      - key: OPENAI_BASE_URL
        value: http://100.89.47.25:20128/v1
      - key: AI_PROVIDER_MODE
        value: real
      - key: MODEL3_FORCE_BASE_URL
        value: http://100.89.47.25:20128/v1
      - key: OPENAI_MODEL
        value: APIFREE
      - key: CHATGPT_MODEL
        value: APIFREE
      - key: CLAUDE_MODEL
        value: APIFREE
      - key: XAI_MODEL
        value: APIFREE
      - key: KIRO_MODEL
        value: Kiro
      - key: CHATGPT_REAL_PROVIDER
        value: 9router
      - key: GROK_REAL_PROVIDER
        value: 9router
      - key: CLAUDE_REAL_PROVIDER
        value: 9router
      - key: BDS_BROWSER_PROFILE
        value: /tmp/lh-bds-browser-profile
