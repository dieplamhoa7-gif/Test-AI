name: LH Investment after-close update

on:
  schedule:
    # 15:30 ICT (Asia/Saigon) on trading weekdays = 08:30 UTC, Monday-Friday.
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lh-after-close-update-1530
  cancel-in-progress: true

jobs:
  after-close-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-news-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure git author
        run: |
          git config user.name "LH Investment Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run LH after-close update pipeline
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python lh_after_close_update/run_lh_after_close_update.py

      - name: Guard final frontend markers after pipeline
        run: |
          python verify_lh_final_frontend_markers.py
          python lh_after_close_update/verify_no_old_version_regression.py
