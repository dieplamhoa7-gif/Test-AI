name: Refresh LH stock chart cache intraday

on:
  schedule:
    # Vietnam market hours, weekdays. Runs hourly from 09:20 to 15:20 ICT.
    # Uses daily OHLC history; VCI/vnstock may expose current-session partial daily candle when available.
    - cron: '20 2-8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lh-stock-chart-cache-intraday
  cancel-in-progress: true

jobs:
  refresh-stock-charts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-news-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh VN100 history for chart cache
        run: python refresh_vn100_history_for_core12.py

      - name: Rebuild stock chart cache
        run: python build_stock_chart_cache.py

      - name: Rebuild day touchzone cache
        run: python export_touchzone_all_day.py

      - name: Commit updated stock chart cache
        run: |
          git config user.name "LH Investment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vn100_history_2025_06_2026_05_cache.json
          git add firebase_public/data/charts
          git diff --cached --quiet || git commit -m "Auto refresh LH stock chart cache"
          git push

      - name: Deploy LHInvestment hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project lhinvestment --token "$FIREBASE_TOKEN"
