<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wyckoff Board</title>
  <script src="/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#07111d;--panel:#0d1827;--line:#203349;--text:#e9f0f8;--muted:#8fa3bc;--green:#37d39a;--red:#ff6f81;--amber:#ffc857;--blue:#6fb3ff}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#10203a 0,#07111d 45%,#05101a 100%);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.page{max-width:1480px;margin:0 auto;padding:18px}.header,.panel,.card{background:rgba(10,18,29,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 36px rgba(0,0,0,.22)}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;margin-bottom:14px}.title{font-size:28px;font-weight:900}.subtitle{color:var(--muted);font-size:13px;margin-top:4px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip,button,select{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--text);font-weight:800;padding:8px 12px}button{cursor:pointer}.active{border-color:var(--amber)!important;background:rgba(255,200,87,.14)!important}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,.8fr);gap:14px}.chartPanel{padding:14px}.chartHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.bigSymbol{font-size:24px;font-weight:900}.meta{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:12px;font-weight:800}.chartWrap{position:relative;border-radius:18px;overflow:hidden;background:#08111c;border:1px solid rgba(255,255,255,.06)}#chart{height:760px}.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}.box{position:absolute;border-radius:10px;border:2px solid rgba(111,179,255,.75);background:rgba(111,179,255,.08)}.zoneSupport{border-color:rgba(55,211,154,.75);background:rgba(55,211,154,.08)}.zoneRes{border-color:rgba(255,111,129,.75);background:rgba(255,111,129,.08)}.tag{position:absolute;padding:3px 8px;border-radius:8px;background:rgba(8,14,22,.96);border:1px solid rgba(255,255,255,.16);font-size:10px;font-weight:900;white-space:nowrap}.line{position:absolute;height:0;transform-origin:0 0;border-top:3px solid var(--green)}.side{display:grid;gap:12px}.card{padding:14px}.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;color:#a9bfd7;text-transform:uppercase}.kv{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04)}.muted{color:var(--muted)}.footer{margin-top:10px;color:var(--muted);font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:1fr}#chart{height:560px}.header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <div><div class="title">WYCKOFF BOARD STRUCTURE MAP</div><div class="subtitle">Clean map · full history from 2023 · stable chart route</div></div>
    <div class="tools"><span class="chip" id="statusChip">Loading</span><label class="chip">Symbol <select id="symbolSel"></select></label><button id="trBtn" class="active">TR</button><button id="channelBtn" class="active">Channel</button><button id="zoneBtn" class="active">Zones</button><button id="eventBtn" class="active">Events</button></div>
  </div>
  <div class="grid">
    <div class="panel chartPanel"><div class="chartHead"><div><div class="bigSymbol" id="heroSymbol">MWG</div><div class="subtitle" id="heroSub">Wyckoff structure / support-resistance / events</div></div><div class="meta" id="heroMeta"></div></div><div class="chartWrap"><div id="chart"></div><div id="overlay" class="overlay"></div></div><div class="footer">If the map looks crowded, turn off Channel / Zones / Events with the buttons above.</div></div>
    <div class="side"><div class="card"><h3>Current Status</h3><div class="kv" id="statusKv"></div></div><div class="card"><h3>Support / Resistance</h3><div class="kv" id="zonesKv"></div></div><div class="card"><h3>Events</h3><div class="kv" id="eventsKv"></div></div></div>
  </div>
</div>
<script>
const VER='2026-06-01-wyckoff-clean-map-v1';
const S={chart:null,candle:null,rows:[],hy:null,symbol:'MWG',hist:null,multi:null,legacy:null,like:null,toggles:{tr:true,channel:true,zones:true,events:true}};
const $=id=>document.getElementById(id); const fmt=(v,d=1)=>Number.isFinite(+v)?(+v).toFixed(d):'-';
async function j(url){const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(url+' '+r.status); return r.json();}
function setStatus(t){$('statusChip').textContent=t;}
function ensureChart(){if(S.chart)return; S.chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#08111c'},textColor:'#d6e2f0'},grid:{vertLines:{color:'rgba(255,255,255,.04)'},horzLines:{color:'rgba(255,255,255,.04)'}},rightPriceScale:{borderColor:'rgba(255,255,255,.08)'},timeScale:{borderColor:'rgba(255,255,255,.08)'}}); S.candle=S.chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});} 
function px(t){const x=S.chart.timeScale().timeToCoordinate(t);return Number.isFinite(x)?x:null} function py(p){const y=S.candle.priceToCoordinate(+p);return Number.isFinite(y)?y:null}
function addBox(cls,x0,x1,lo,hi,label){const a=px(x0),b=px(x1),yt=py(hi),yb=py(lo); if([a,b,yt,yb].some(v=>v==null))return; const left=Math.min(a,b), top=Math.min(yt,yb), w=Math.max(8,Math.abs(b-a)), h=Math.max(8,Math.abs(yb-yt)); const d=document.createElement('div'); d.className='box '+(cls||''); Object.assign(d.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px'}); $('overlay').appendChild(d); if(label)addTag(label,left+5,Math.max(48,top-18));}
function addTag(text,x,y){const d=document.createElement('div'); d.className='tag'; d.textContent=text; Object.assign(d.style,{left:Math.max(5,x)+'px',top:Math.max(40,y)+'px'}); $('overlay').appendChild(d);} 
function addLine(t0,p0,t1,p1,color,label){const x0=px(t0),y0=py(p0),x1=px(t1),y1=py(p1); if([x0,y0,x1,y1].some(v=>v==null))return; const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy); if(!Number.isFinite(len)||len<8)return; const d=document.createElement('div'); d.className='line'; Object.assign(d.style,{left:x0+'px',top:y0+'px',width:len+'px',borderTopColor:color||'var(--green)',transform:`rotate(${Math.atan2(dy,dx)}rad)`}); $('overlay').appendChild(d); if(label)addTag(label,Math.min(x0,x1)+8,Math.min(y0,y1)-22);}
function getHybrid(sym){return (S.like?.symbols||{})[sym] || (sym==='MWG'?S.legacy:null) || (S.multi?.symbols||{})[sym] || null;}
function timeAt(idx){return S.rows[idx]?.time} function offsetIdx(i){return Math.max(0,S.rows.length-260)+Number(i||0)}
function draw(){const ov=$('overlay'); ov.innerHTML=''; if(!S.rows.length||!S.hy)return; const tr=S.hy.mainTr; if(S.toggles.tr&&tr){const i0=offsetIdx(tr.start_idx),i1=offsetIdx(tr.end_idx); if(timeAt(i0)&&timeAt(i1)) addBox('',timeAt(i0),timeAt(i1),tr.low,tr.high,'Main TR');}
 if(S.toggles.channel){const wc=S.hy.modelState?.wyckoffChannel||{}; const ws=offsetIdx(wc.window?.start_idx||0); const lows=wc.anchors?.lowPoints||[], highs=wc.anchors?.highPoints||[]; const lowLine=wc.lines?.lowLine, highLine=wc.lines?.highLine; if(lows.length>=2&&highs.length>=2&&lowLine&&highLine){const first=ws+Math.min(lows[0].idx,highs[0].idx), last=ws+Math.max(lows[lows.length-1].idx,highs[highs.length-1].idx); const rel=i=>i-ws; if(timeAt(first)&&timeAt(last)){addLine(timeAt(first),lowLine.slope*rel(first)+lowLine.intercept,timeAt(last),lowLine.slope*rel(last)+lowLine.intercept,'rgba(55,211,154,.95)','Channel low'); addLine(timeAt(first),highLine.slope*rel(first)+highLine.intercept,timeAt(last),highLine.slope*rel(last)+highLine.intercept,'rgba(55,211,154,.95)','Channel high');}}}
 if(S.toggles.zones){const sw=S.hy.supportsByWindow||{}, rw=S.hy.resistancesByWindow||{}; [['S 6M',sw['6m'],'zoneSupport'],['S 1Y',sw['1y'],'zoneSupport'],['R 6M',rw['6m'],'zoneRes'],['R 1Y',rw['1y'],'zoneRes']].forEach(([lab,z,cls])=>{if(z&&z.from&&z.to)addBox(cls,z.from,z.to,z.low,z.high,lab)});} 
 if(S.toggles.events){(S.hy.events||[]).slice(-30).forEach(ev=>{if(ev.time&&Number.isFinite(+ev.price)) addTag(ev.type||'EV',px(ev.time)||0,(py(ev.price)||60)-24);});}}
function fillSide(){const m=S.hy?.modelState||{}, sum=S.hy?.story?.summary||{}; $('heroSymbol').textContent=S.symbol; $('heroMeta').innerHTML=[['Close',fmt(S.rows.at(-1)?.close)],['Phase',S.hy?.phaseBox?.phase||'-'],['State',m.state||'-']].map(([k,v])=>`<span class="badge">${k}: ${v}</span>`).join(''); $('statusKv').innerHTML=[['State',m.state||'-'],['Action',m.action||'-'],['Bias',sum.bias||S.hy?.mainTr?.bias||'-'],['Confirm',m.confirmAbove??sum.bullishConfirmAbove??'-'],['Invalid',m.invalidBelow??sum.invalidateBelow??'-']].map(([k,v])=>`<div class="row"><span class="muted">${k}</span><b>${v}</b></div>`).join(''); const sw=S.hy?.supportsByWindow||{}, rw=S.hy?.resistancesByWindow||{}; $('zonesKv').innerHTML=[['S 6M',sw['6m']],['S 1Y',sw['1y']],['R 6M',rw['6m']],['R 1Y',rw['1y']]].filter(x=>x[1]).map(([k,z])=>`<div class="row"><span class="muted">${k}</span><b>${fmt(z.low)} - ${fmt(z.high)}</b></div>`).join('')||'<div class="muted">No zone data</div>'; $('eventsKv').innerHTML=(S.hy?.events||[]).slice(-6).reverse().map(e=>`<div class="row"><span>${e.type||'-'}</span><b>${e.time||''}</b></div>`).join('')||'<div class="muted">No event data</div>';}
async function render(sym){setStatus('Loading '+sym); ensureChart(); S.symbol=sym; S.rows=(S.hist?.symbols?.[sym]?.rows||[]).map(x=>({time:x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close,volume:+x.volume})); S.hy=getHybrid(sym); if(!S.rows.length)throw new Error('No history for '+sym); if(!S.hy)throw new Error('No Wyckoff cache for '+sym); S.candle.setData(S.rows); S.chart.timeScale().setVisibleRange({from:S.rows[0].time,to:S.rows[S.rows.length-1].time}); fillSide(); setTimeout(()=>{draw();fillSide();},250); setStatus('Ready');}
async function boot(){try{setStatus('Loading data'); [S.hist,S.multi,S.legacy,S.like]=await Promise.all([j('/data/vn100_history_from_2023.json?ts='+Date.now()),j('/data/wyckoff_hybrid_multi_full.json?ts='+Date.now()),j('/data/wyckoff_hybrid_cache.json?ts='+Date.now()),j('/data/wyckoff_hybrid_like_mwg_multi.json?ts='+Date.now())]); const syms=['MWG',...Array.from(new Set([...Object.keys(S.hist.symbols||{}),...Object.keys(S.multi.symbols||{}),...Object.keys(S.like.symbols||{})])).filter(x=>x&&x!=='MWG').sort()]; $('symbolSel').innerHTML=syms.map(s=>`<option value="${s}">${s}</option>`).join(''); $('symbolSel').onchange=()=>render($('symbolSel').value).catch(e=>{console.error(e);setStatus('Error')}); ['tr','channel','zones','events'].forEach(k=>{$(k+'Btn').onclick=()=>{S.toggles[k]=!S.toggles[k];$(k+'Btn').classList.toggle('active',S.toggles[k]);draw();};}); window.addEventListener('resize',()=>setTimeout(draw,150)); await render('MWG');}catch(e){console.error(e);setStatus('Error'); $('heroSub').textContent=String(e.message||e);}}
boot();
</script>
</body>
</html>
