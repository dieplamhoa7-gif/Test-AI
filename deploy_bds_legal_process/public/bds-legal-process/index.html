<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quy trình pháp lý BĐS</title><style>
:root{--bg:#f4efe7;--paper:#fffaf2;--ink:#152019;--muted:#667166;--line:#d7cbb9;--green:#1f513d;--gold:#a97a24;--red:#96382e;--blue:#244d76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,Segoe UI,Arial}header{padding:26px clamp(18px,4vw,56px);background:#fbf7ef;border-bottom:1px solid var(--line)}h1{font-size:clamp(30px,4.5vw,54px);line-height:1;margin:0 0 10px;letter-spacing:-.045em}.sub{max-width:1100px;color:var(--muted);font-size:17px}.wrap{display:grid;grid-template-columns:430px 1fr;gap:22px;padding:22px clamp(18px,4vw,56px)}aside{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto}.timeline{border-left:3px solid var(--line);padding-left:18px}.stepbtn{position:relative;display:block;width:100%;text-align:left;margin:0 0 12px;border:1px solid var(--line);background:#fffaf5;border-radius:18px;padding:13px 14px;cursor:pointer}.stepbtn:before{content:"";position:absolute;left:-29px;top:20px;width:16px;height:16px;border-radius:50%;background:white;border:3px solid var(--gold)}.stepbtn.active{background:var(--green);color:white}.stepbtn.active .meta{color:#dfeae3}.no{font-weight:900;color:var(--gold);font-size:13px;letter-spacing:.08em}.stepbtn.active .no{color:#f3cf83}.name{font-weight:850;font-size:16px}.meta{color:var(--muted);font-size:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 28px #0000000b}.crumb{color:var(--gold);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.08em}h2{font-size:clamp(26px,3vw,42px);line-height:1.08;margin:8px 0}.lead{font-size:19px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.box{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:13px}.box h3{margin:0 0 8px;color:var(--green);font-size:13px;text-transform:uppercase;letter-spacing:.06em}.risk{border-color:#e3b9ae;background:#fff7f4}.risk h3{color:var(--red)}ul{margin:0;padding-left:0;list-style:none}.lines{display:grid;gap:6px}.line{padding:0;margin:0}.proc{border:1px solid var(--line);border-radius:16px;background:white;margin:10px 0;padding:13px}.proc summary{cursor:pointer;font-weight:850;color:var(--blue)}.small{font-size:13px;color:var(--muted)}.arrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid var(--line);border-radius:999px;background:white;padding:7px 10px;font-weight:700;color:var(--green)}.basis-list{display:grid;gap:10px}.basis-item{background:white;border:1px solid var(--line);border-radius:14px;padding:12px}.basis-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.doc{font-weight:900;color:var(--blue)}.art{font-size:13px;color:var(--gold);font-weight:800}.abbr{display:flex;gap:8px;flex-wrap:wrap}.abbr span{border:1px solid var(--line);border-radius:999px;background:white;padding:6px 9px;font-size:12px}@media(max-width:980px){.wrap{grid-template-columns:1fr}aside{position:relative;max-height:none}.grid{grid-template-columns:1fr}}</style></head><body><header><div class=crumb>Process timeline / bám sát luật gốc</div><h1 id=title></h1><div class=sub id=sub></div></header><div class=wrap><aside><div class=timeline id=timeline></div></aside><main><section class=card id=detail></section><section class=card style="margin-top:16px"><div class=crumb>Chú thích viết tắt</div><div class=abbr id=abbr></div></section></main></div><script>
let DATA;fetch('bds_process_timeline_lawfaithful.json').then(r=>r.json()).then(d=>{DATA=d;init()});function init(){title.textContent=DATA.title;sub.textContent=DATA.subtitle+' — Phần căn cứ chỉ rút gọn câu chữ từ điều luật, không thêm suy diễn.';abbr.innerHTML=Object.entries(DATA.abbreviations).map(([k,v])=>`<span><b>${k}</b>: ${v}</span>`).join('');timeline.innerHTML=DATA.steps.map((s,i)=>`<button class="stepbtn ${i==0?'active':''}" onclick="show(${i})"><div class=no>BƯỚC ${s.no} · ${s.phase}</div><div class=name>${s.title.replace(/^Gate \d+ — /,'')}</div><div class=meta>${s.when}</div></button>`).join('');show(0)}
function arr(t,a,cls=''){return `<div class="box ${cls}"><h3>${t}</h3>${a&&a.length?`<div class=lines>${a.map(x=>`<div class=line>${x}</div>`).join('')}</div>`:'<p class=small>Chưa có / tùy case.</p>'}</div>`}
function legal(items){if(!items||!items.length)return '<p class=small>Chưa có căn cứ riêng ở mục này.</p>';return `<div class=basis-list>${items.map(b=>`<div class=basis-item><div class=basis-top><span class=doc>${b.doc}</span><span class=art>${b.article}</span></div><div class=lines>${b.points.map(p=>`<div class=line>${p}</div>`).join('')}</div></div>`).join('')}</div>`}
function proc(p){return `<details class=proc><summary>${p.title}</summary><p>${p.summary||''}</p>${arr('Output',p.outputs)}${arr('Checkpoint',p.checkpoints)}${arr('Rủi ro',p.risks,'risk')}<div class=box><h3>Căn cứ & tóm tắt nội dung văn bản</h3>${legal(p.legal_points)}</div></details>`}
function show(i){document.querySelectorAll('.stepbtn').forEach((b,j)=>b.classList.toggle('active',j==i));let s=DATA.steps[i];let prev=DATA.steps[i-1],next=DATA.steps[i+1];detail.innerHTML=`<div class=crumb>BƯỚC ${s.no} · ${s.phase}</div><h2>${s.title}</h2><p class=lead>${s.summary}</p><div class=arrow>${prev?`<span class=pill>Trước: ${prev.phase}</span>`:''}<span class=pill>Đang làm: ${s.phase}</span>${next?`<span class=pill>Sau: ${next.phase}</span>`:''}</div><div class=grid>${arr('Làm khi nào?', [s.when])}${arr('Việc NĐT cần chú ý',s.expert_focus||[])}${arr('Output thực chiến',s.expert_outputs||s.outputs)}${arr('Checkpoint / điều kiện',s.expert_checkpoints||s.checkpoints)}${arr('Rủi ro',s.expert_risks||s.risks,'risk')}</div>${arr('Route/rẽ nhánh cần quyết',s.routes)}${arr('Điều kiện chi tiết',s.detail_conditions||[])}${arr('Các bước thực hiện',s.detail_steps||[])}${arr('Hồ sơ cần chuẩn bị',s.detail_dossier||[])}${arr('Thời hạn / thời gian thực tế',s.detail_timeline||[])}<div class=box><h3>Thủ tục con trong bước này</h3>${s.procedures.map(proc).join('')}</div><div class=box><h3>Căn cứ & tóm tắt nội dung văn bản</h3>${legal(s.legal_points)}</div>`}
</script></body></html>
