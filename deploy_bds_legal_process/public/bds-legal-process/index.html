<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lưu đồ đầu tư xây dựng dự án BĐS</title><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#172033;--muted:#667085;--line:#c9d4e5;--blue:#1967d2;--green:#2f9e44;--pink:#d63384;--amber:#f59f00;--purple:#7048e8;--red:#e03131;--shadow:0 16px 50px rgba(31,44,71,.14)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff,#fbfcff 35%,#f6f8fb);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid #dde5f0;padding:12px 18px}.top h1{margin:0;font-size:22px;letter-spacing:-.02em}.top p{margin:4px 0 0;color:var(--muted)}.wrap{padding:18px;max-width:2100px;margin:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}.lg{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:13px;height:13px;border-radius:4px}.board{position:relative;overflow:auto;border:1px solid #d7e0ed;background:linear-gradient(#fff,#f8fbff);border-radius:22px;box-shadow:var(--shadow);padding:18px}.flow{position:relative;display:grid;grid-template-columns:repeat(11, minmax(180px,1fr));grid-auto-rows:minmax(104px,auto);gap:22px 28px;min-width:1980px}.laneLabel{position:sticky;left:0;z-index:5;align-self:stretch;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#334155;background:#eef4ff;border:1px solid #d5e0ee;border-radius:14px;font-size:11px}.node{position:relative;border:2px solid var(--blue);border-radius:14px;background:var(--paper);padding:10px;box-shadow:0 10px 28px rgba(25,103,210,.08);cursor:pointer;min-height:98px;transition:.18s;overflow:hidden}.node:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(25,103,210,.18)}.node:after{content:"";position:absolute;right:-31px;top:50%;width:30px;border-top:3px solid #2b6cb0}.node:last-child:after{display:none}.node .code{display:inline-block;background:#0b3d91;color:white;border-radius:7px;padding:3px 7px;font:900 11px ui-monospace,monospace}.node h3{margin:8px 0 6px;font-size:14px;line-height:1.22}.node p{margin:0;color:#475467;font-size:12px}.legal{border-color:var(--green);background:#f4fff7}.design{border-color:var(--purple);background:#f8f5ff}.construct{border-color:var(--amber);background:#fff9ed}.business{border-color:var(--pink);background:#fff5fa}.handover{border-color:#15aabf;background:#f2fcff}.support{border-style:dashed;border-color:#64748b;background:#f8fafc}.subgrid{display:grid;gap:9px}.small{min-height:72px;border-width:1.5px}.small:after{display:none}.phaseHead{grid-row:1}.lane2{grid-row:2}.lane3{grid-row:3}.lane4{grid-row:4}.lane5{grid-row:5}.lane6{grid-row:6}.lane7{grid-row:7}.col1{grid-column:1}.col2{grid-column:2}.col3{grid-column:3}.col4{grid-column:4}.col5{grid-column:5}.col6{grid-column:6}.col7{grid-column:7}.col8{grid-column:8}.col9{grid-column:9}.col10{grid-column:10}.col11{grid-column:11}.modal{position:fixed;inset:0;display:none;z-index:99;background:rgba(10,18,32,.58);padding:28px;overflow:auto}.modal.open{display:block}.dialog{max-width:1120px;margin:0 auto;background:white;border-radius:24px;box-shadow:0 30px 110px rgba(0,0,0,.35);overflow:hidden}.dlgTop{padding:22px 26px;background:linear-gradient(135deg,#0b3d91,#1c7ed6);color:white;position:relative}.close{position:absolute;right:18px;top:14px;border:0;background:rgba(255,255,255,.16);color:white;border-radius:999px;width:38px;height:38px;font-size:22px;cursor:pointer}.dlgTop h2{margin:8px 48px 4px 0;font-size:28px;letter-spacing:-.04em}.dlgTop .meta{opacity:.9}.dlgBody{padding:22px 26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{border:1px solid #e2e8f0;border-radius:16px;padding:14px;background:#fff}.section.full{grid-column:1/-1}.section h4{margin:0 0 10px;color:#0b3d91;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.line{padding:8px 0;border-bottom:1px solid #eef2f7}.line:last-child{border-bottom:0}.law{border:1px solid #dbeafe;border-radius:16px;margin:12px 0;padding:14px;background:#f8fbff}.lawHead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.doc{background:#0b3d91;color:white;border-radius:9px;padding:5px 8px;font:900 12px ui-monospace,monospace}.article{background:#fff3bf;color:#5f3f00;border-radius:9px;padding:5px 8px;font-weight:800;font-size:12px}.source{color:#667085;font-size:12px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #cfe0f5;background:white;border-radius:999px;padding:8px 11px;cursor:pointer;color:#0b3d91;font-weight:800}.btn:hover{background:#edf6ff}@media(max-width:900px){.dlgBody{grid-template-columns:1fr}.modal{padding:10px}.top h1{font-size:18px}}
</style></head><body><header class="top"><h1>Lưu đồ đầu tư xây dựng dự án BĐS</h1><p>Thiết kế theo bản lưu đồ TPRE: bấm từng ô để mở popup luật liên quan, quy trình, thời gian, điều kiện, lưu ý và nguồn điều/khoản.</p></header><main class="wrap"><div class="legend"><span class="lg"><i class="dot" style="background:#f4fff7;border:2px solid #2f9e44"></i>Pháp lý/đất</span><span class="lg"><i class="dot" style="background:#f8f5ff;border:2px solid #7048e8"></i>Thiết kế</span><span class="lg"><i class="dot" style="background:#fff9ed;border:2px solid #f59f00"></i>Thi công</span><span class="lg"><i class="dot" style="background:#fff5fa;border:2px solid #d63384"></i>Kinh doanh</span><span class="lg"><i class="dot" style="background:#f2fcff;border:2px solid #15aabf"></i>Bàn giao/cấp sổ</span></div><section class="board"><div class="flow" id="flow"></div></section></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dlgTop"><button class="close" onclick="closeModal()">×</button><div id="mcode"></div><h2 id="mtitle"></h2><div class="meta" id="mmeta"></div></div><div class="dlgBody" id="mbody"></div></div></div><script>
let DATA, ALL=[];const layout={I:['col1','legal'],II:['col2','support'],III:['col3','legal'],IV:['col4','design'],V:['col5','legal'],VI:['col6','design'],VII:['col7','construct'],VIII:['col8','business'],IX:['col9','construct'],X:['col10','handover'],XI:['col11','handover']};
fetch('tpre_bds_flow.json').then(r=>r.json()).then(d=>{DATA=d;build()});
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function lines(a){return (a&&a.length?a:['Chưa có dữ liệu — sẽ bổ sung khi tách node chi tiết từ PDF.']).map(x=>`<div class="line">${esc(x)}</div>`).join('')}
function cls(id){return (layout[id]||['col1','legal']).join(' ')}
function build(){const f=document.getElementById('flow');ALL=[];DATA.phases.forEach((p,idx)=>{const [col,type]=layout[p.id]||['col1','legal']; const it=p.items&&p.items[0]||p; ALL.push({phase:p,item:it}); f.insertAdjacentHTML('beforeend',`<div class="node phaseHead ${col} ${type}" onclick="openNode(${ALL.length-1})"><span class="code">${esc(p.id)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p></div>`);});
 // lane/detail nodes approximating PDF subboxes
 const subs=[['I','lane2','I-I.1','Kiểm tra hiện trạng khu đất / Legal DD','support'],['I','lane3','I-O.1','Product brief / cấu trúc pháp lý chính','support'],['II','lane2','II-I.1','Bản đồ ranh đất, hiện trạng, danh sách chủ đất','support'],['II','lane3','II-O.1','Phương án bồi thường, GPMB, TĐC','legal'],['III','lane2','III-I.1','Hồ sơ năng lực NĐT / pháp lý đất đai','support'],['III','lane3','III-O.1','CTCTĐT, công nhận CĐT, ký quỹ','legal'],['IV','lane2','IV-I.1','Nhiệm vụ QHCT / thiết kế ý tưởng','design'],['IV','lane3','IV-O.1','Phê duyệt QHCT 1/500 / QLXD theo đồ án','design'],['V','lane2','V-I.1','Bản đồ HTVT, cắm mốc, bàn giao ranh','support'],['V','lane3','V-O.1','QĐ giao/thuê đất, giá đất, nghĩa vụ tài chính','legal'],['V','lane4','V-O.2','GCN QSDĐ dự án','legal'],['VI','lane2','VI-I.1','TKCS/BCNCKT, TKKT/TKBVTC, khảo sát','design'],['VI','lane3','VI-O.1','ĐTM/GPMT, PCCC, đấu nối HTKT','design'],['VI','lane4','VI-O.2','GPXD và thông báo khởi công','design'],['VII','lane2','VII-I.1','Thi công san nền, HTKT, phần ngầm/thân','construct'],['VII','lane3','VII-O.1','Nghiệm thu giai đoạn / hồ sơ hoàn công','construct'],['VIII','lane2','VIII-I.1','Mẫu HĐMB, bảo lãnh, nghiệm thu mốc','business'],['VIII','lane3','VIII-O.1','Thông báo đủ điều kiện bán HTTTL','business'],['IX','lane2','IX-I.1','Nghiệm thu PCCC, môi trường, chất lượng','construct'],['IX','lane3','IX-O.1','Văn bản kiểm tra nghiệm thu đưa vào sử dụng','construct'],['X','lane2','X-I.1','Bản vẽ phân lô, sơ đồ nhà đất, hồ sơ cấp GCN','handover'],['X','lane3','X-O.1','Bàn giao nhà / cấp GCN cho khách hàng','handover'],['XI','lane2','XI-I.1','Bảo hành, vận hành, hậu kiểm','handover']];
 subs.forEach(s=>{const p=DATA.phases.find(x=>x.id===s[0]); const it=p.items[0]; const obj={phase:p,item:{...it,code:s[2],title:s[3],summary:'Node chi tiết theo mã lưu đồ PDF. Nội dung pháp lý kế thừa từ mốc chính và sẽ tiếp tục được tách sâu theo hồ sơ/thủ tục riêng.',owner:p.lane}}; ALL.push(obj); const [col]=layout[s[0]]; f.insertAdjacentHTML('beforeend',`<div class="node small ${s[1]} ${col} ${s[4]}" onclick="openNode(${ALL.length-1})"><span class="code">${esc(s[2])}</span><h3>${esc(s[3])}</h3></div>`)});
}
function openNode(i){const o=ALL[i], it=o.item, p=o.phase; mcode.innerHTML=`<span class="code">${esc(it.code||p.id)}</span>`; mtitle.textContent=it.title||p.title; mmeta.textContent=`Lane: ${it.owner||p.lane} · Phase ${p.id}: ${p.title}`; mbody.innerHTML=`<div class="section full"><h4>Tóm tắt nội dung / vai trò trong lưu đồ</h4><div class="line">${esc(it.summary||p.summary)}</div></div><div class="section"><h4>Quy trình / việc phải làm</h4>${lines(it.inputs)}</div><div class="section"><h4>Kết quả / output pháp lý</h4>${lines(it.outputs)}</div><div class="section"><h4>Thời gian thực hiện</h4>${lines(timelineFor(p.id))}</div><div class="section"><h4>Điều kiện & thông tin quan trọng</h4>${lines(checkFor(p.id))}</div><div class="section full"><h4>Luật liên quan — tóm tắt trước, nguồn sau</h4>${laws(it.legal_basis)}</div>`; modal.classList.add('open')}
function timelineFor(id){return {I:['Nội bộ: 1–4 tuần tùy chất lượng hồ sơ đất, dữ liệu quy hoạch và độ phức tạp M&A/DD.','Không phải thời hạn luật định; dùng để lập kế hoạch tiền khả thi.'],II:['GPMB thường kéo dài theo hiện trạng sử dụng đất, số lượng chủ sử dụng, khiếu nại và ngân sách bồi thường.','Thời hạn luật định phải đối chiếu từng quyết định thu hồi/kiểm đếm/phương án bồi thường.'],III:['CTCTĐT/lựa chọn NĐT phụ thuộc thẩm quyền, hình thức chọn NĐT và mức độ hoàn chỉnh hồ sơ.'],IV:['QHCT 1/500/tổng mặt bằng phụ thuộc quy hoạch cấp trên, lấy ý kiến, thẩm định và phê duyệt.'],V:['Giao đất/giá đất/nghĩa vụ tài chính thường là đường găng; phải tách timeline giao đất và timeline xác định giá đất.'],VI:['Thiết kế, PCCC, môi trường, đấu nối, GPXD chạy song song nhưng có phụ thuộc chéo.'],VII:['Theo tiến độ thi công và nghiệm thu giai đoạn được phê duyệt.'],VIII:['Chỉ mở bán/huy động vốn sau khi đủ điều kiện pháp lý và nghiệm thu mốc theo loại sản phẩm.'],IX:['Nghiệm thu hoàn thành phụ thuộc hồ sơ chất lượng, PCCC, môi trường, đấu nối và kiểm tra CQNN.'],X:['Cấp GCN phụ thuộc nghĩa vụ tài chính, hoàn công, bản vẽ, giải chấp và hồ sơ người mua.'],XI:['Theo thời hạn bảo hành/vận hành và nghĩa vụ hậu kiểm cụ thể.']}[id]||[]}
function checkFor(id){return {I:['Chốt route pháp lý đất/đầu tư trước khi đặt cọc hoặc M&A.','Kiểm tra đất công/xen kẹt, quy hoạch, chỉ tiêu dân số, hạ tầng, môi trường.'],II:['Phân biệt GPMB nhà nước thu hồi đất và tự thỏa thuận/thu mua.','Kiểm tra rủi ro khiếu nại, tài sản trên đất, chỉnh lý GCN.'],III:['Xác định hình thức lựa chọn NĐT: đấu giá, đấu thầu, chấp thuận NĐT hoặc route có đất.','Kiểm tra ký quỹ/bảo lãnh thực hiện dự án.'],IV:['QHCT phải đủ cơ sở cho thiết kế, GPXD, giao đất, bán hàng và cấp sổ.'],V:['Không có quyết định đất/tài chính đất rõ thì chưa nên coi dự án đủ sạch pháp lý.'],VI:['PCCC, môi trường, đấu nối phải xử lý cùng thiết kế, không để sát nghiệm thu.'],VII:['Thi công phải khớp GPXD/TKBVTC; lưu hồ sơ chất lượng từ đầu.'],VIII:['Kiểm tra bảo lãnh, mẫu HĐMB, công khai thông tin, nghiệm thu phần móng/HTKT.'],IX:['Thiếu PCCC/môi trường/hoàn công sẽ nghẽn bàn giao.'],X:['Cấp sổ cần bản vẽ, hoàn công, nghĩa vụ tài chính, giải chấp, hồ sơ khách hàng.'],XI:['Bảo hành nhà thầu và bảo hành khách hàng phải quản lý tách bạch.']}[id]||[]}
function laws(a){return (a||[]).map(l=>`<div class="law"><div class="lawHead"><span class="doc">${esc(l.doc)}</span><span class="article">${esc(l.article)}</span></div>${lines(l.points)}<div class="source">Nguồn: ${esc(l.source_file||'local corpus')} · ${esc(l.article||'đang cập nhật điều/khoản')}</div></div>`).join('')||'<div class="line">Chưa map căn cứ.</div>'}
function closeModal(){modal.classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
