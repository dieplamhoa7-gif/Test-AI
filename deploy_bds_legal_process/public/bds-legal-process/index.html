<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quy trình pháp lý BĐS</title><style>
:root{--bg:#070b11;--panel:#0d131d;--panel2:#101824;--ink:#e8f0f8;--muted:#7f8fa1;--line:#213044;--cyan:#22d3ee;--green:#34d399;--violet:#a78bfa;--amber:#fbbf24;--red:#fb7185;--glow:#22d3ee55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#164e632e,transparent 34%),radial-gradient(circle at 90% 0,#4c1d9524,transparent 30%),var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 0,#000 0,transparent 70%);animation:gridDrift 18s linear infinite}@keyframes gridDrift{to{transform:translateY(44px)}}header{position:sticky;top:0;z-index:30;background:#070b11dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px clamp(16px,4vw,56px)}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--cyan);font:800 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--glow)}h1{margin:8px 0 4px;font-size:clamp(24px,4vw,42px);line-height:1.05;letter-spacing:-.04em}.sub{color:var(--muted);max-width:1100px}.wrap{max-width:1420px;margin:0 auto;padding:18px clamp(14px,3vw,34px) 48px}.stepsTop{position:sticky;top:92px;z-index:20;background:#070b11d9;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 16px 50px #0008}.stepScroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.step{min-width:180px;border:1px solid var(--line);background:linear-gradient(180deg,#101824,#0b111a);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.22s}.step:hover{transform:translateY(-2px);border-color:#35506d}.step.active{border-color:var(--cyan);box-shadow:0 0 0 1px #22d3ee66,0 0 28px #22d3ee18;background:#10202b}.no{font:900 11px ui-monospace,monospace;color:var(--cyan)}.phase{font:800 10px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stitle{font-weight:850;margin-top:5px;line-height:1.25}.mainGrid{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);background:#0d131de8;border-radius:18px;padding:14px;min-width:0;overflow:visible;animation:fadeUp .28s ease both}.panel h2{margin:4px 0 8px;font-size:clamp(20px,2.4vw,30px);line-height:1.1}.label{font:900 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan)}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:12px}.card{border:1px solid var(--line);background:#0a1018;border-radius:14px;padding:12px;min-width:0}.card h3{margin:0 0 8px;font:900 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan)}.focus h3,.output h3{color:var(--green)}.steps h3,.deep h3{color:var(--violet)}.time h3,.check h3{color:var(--amber)}.risk{background:#1a0f14;border-color:#3f1d2a}.risk h3{color:var(--red)}.line{padding:6px 0;border-bottom:1px dashed #ffffff0d;color:#dce7f0;overflow-wrap:anywhere}.line:last-child{border-bottom:0}.procList{display:grid;gap:8px;margin-top:10px}.proc{border:1px solid var(--line);background:#0b121b;border-radius:12px;padding:10px;cursor:pointer;transition:.2s}.proc:hover{border-color:var(--violet);transform:translateX(2px)}.proc.active{border-color:var(--violet);background:#1a1430;box-shadow:0 0 0 1px #a78bfa55}.proc b{display:block;color:var(--ink)}.proc p{margin:4px 0 0;color:var(--muted);font-size:12px}.deepArea{margin-top:14px}.basis-item{border:1px solid var(--line);background:#0b111a;border-radius:12px;padding:10px;margin-top:8px}.basis-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.doc{font:900 11px ui-monospace,monospace;color:var(--cyan);background:#22d3ee18;padding:4px 7px;border-radius:7px}.art{font-size:12px;color:var(--muted);font-weight:700}.stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid var(--line);border-radius:999px;background:#0b111a;padding:6px 9px;color:var(--muted);font-size:12px}.pill.now{color:var(--cyan);border-color:var(--cyan)}.abbr{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.abbr span{border:1px solid var(--line);background:#0b111a;border-radius:999px;padding:6px 9px;color:var(--muted);font-size:12px}.abbr b{color:var(--ink)}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:980px){.mainGrid{grid-template-columns:1fr}.stepsTop{top:82px}.step{min-width:155px}}
</style></head><body><header><div class="eyebrow"><span class="dot"></span>Guided flow · tầng trên điều khiển tầng dưới</div><h1>Quy trình pháp lý đầu tư dự án BĐS</h1><div class="sub">Tầng 1: các bước chính. Tầng 2: detail của bước đang chọn. Tầng 3: thủ tục con và căn cứ chi tiết chạy theo lựa chọn.</div></header><main class="wrap"><section class="stepsTop"><div class="label">Tầng 1 · Flow chính</div><div class="stepScroller" id="stepsTop"></div></section><section class="mainGrid"><div class="panel" id="stepDetail"></div><div class="panel" id="deepDetail"></div></section><section class="panel" style="margin-top:14px"><div class="label">Chú thích viết tắt</div><div class="abbr" id="abbr"></div></section></main><script>
let DATA, stepIndex=0, procIndex=0;fetch('bds_process_timeline_lawfaithful.json').then(r=>r.json()).then(d=>{DATA=d;render();});
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function lines(items){return items&&items.length?items.map(x=>`<div class="line">${esc(x)}</div>`).join(''):'<div class="line muted">Chưa có / tùy case.</div>'}
function card(t,items,cls=''){return `<div class="card ${cls}"><h3>${esc(t)}</h3>${lines(items)}</div>`}
function basis(items){if(!items||!items.length)return '<div class="line muted">Chưa có căn cứ riêng.</div>';return items.map(b=>`<div class="basis-item"><div class="basis-top"><span class="doc">${esc(b.doc)}</span><span class="art">${esc(b.article)}</span></div>${lines(b.points||[])}</div>`).join('')}
function render(){let s=DATA.steps[stepIndex];stepsTop.innerHTML=DATA.steps.map((x,i)=>`<button class="step ${i===stepIndex?'active':''}" onclick="stepIndex=${i};procIndex=0;render()"><div class="no">B${esc(x.no)}</div><div class="phase">${esc(x.phase)}</div><div class="stitle">${esc(x.title.replace(/^Gate \d+ — /,''))}</div></button>`).join('');let prev=DATA.steps[stepIndex-1],next=DATA.steps[stepIndex+1];stepDetail.innerHTML=`<div class="label">Tầng 2 · Detail bước đang chọn</div><h2>${esc(s.title)}</h2><p class="muted">${esc(s.summary)}</p><div class="stage">${prev?`<span class="pill">Trước: ${esc(prev.phase)}</span>`:''}<span class="pill now">Đang chọn: ${esc(s.phase)}</span>${next?`<span class="pill">Sau: ${esc(next.phase)}</span>`:''}</div><div class="cards">${card('Việc NĐT cần chú ý',s.expert_focus||[],'focus')}${card('Output thực chiến',s.expert_outputs||s.outputs,'output')}${card('Checkpoint / điều kiện',s.expert_checkpoints||s.checkpoints,'check')}${card('Rủi ro',s.expert_risks||s.risks,'risk')}${card('Route/rẽ nhánh cần quyết',s.routes,'route')}${s.deep_summary?card('Phân tích sâu',[s.deep_summary],'deep'):''}</div><div class="deepArea"><div class="label">Tầng 3 · Chọn thủ tục con</div><div class="procList">${(s.procedures||[]).map((p,i)=>`<div class="proc ${i===procIndex?'active':''}" onclick="procIndex=${i};renderDeep()"><b>${esc(p.title)}</b><p>${esc(p.summary)}</p></div>`).join('')}</div></div>`;renderDeep();abbr.innerHTML=Object.entries(DATA.abbreviations||{}).map(([k,v])=>`<span><b>${esc(k)}</b>: ${esc(v)}</span>`).join('')}
function renderDeep(){let s=DATA.steps[stepIndex], p=(s.procedures||[])[procIndex];deepDetail.innerHTML=`<div class="label">Tầng 3 · Detail sâu chạy theo lựa chọn</div><h2>${p?esc(p.title):esc(s.title)}</h2><p class="muted">${p?esc(p.summary):'Chọn thủ tục con ở panel bên trái để xem chi tiết.'}</p><div class="cards">${card('Điều kiện pháp lý chi tiết',s.detail_conditions||[],'check')}${card('Trình tự thực hiện',s.detail_steps||[],'steps')}${card('Cơ quan xử lý/tham gia',s.detail_authority||[],'auth')}${card('Thời hạn / thời gian thực tế',s.detail_timeline||[],'time')}${card('Lỗi thực chiến thường gặp',s.detail_mistakes||[],'risk')}${p?card('Output thủ tục',p.outputs||[],'output'):''}${p?card('Checkpoint thủ tục',p.checkpoints||[],'check'):''}${p?card('Rủi ro thủ tục',p.risks||[],'risk'):''}</div><div class="deepArea"><div class="label">Căn cứ & tóm tắt nội dung văn bản</div>${basis(p?(p.legal_points||[]):(s.legal_points||[]))}</div>`}
</script></body></html>
