<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lưu đồ đầu tư xây dựng dự án BĐS</title><style>
:root{--bg:#050712;--ink:#f7f9ff;--soft:#cbd7ea;--muted:#8ea0b8;--line:rgba(255,255,255,.12);--glass:rgba(11,17,32,.72);--cyan:#67e8f9;--violet:#c084fc;--green:#86efac;--amber:#fde68a;--rose:#fb7185;--blue:#93c5fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050712;color:var(--ink);font:15px/1.58 Inter,system-ui,Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:-20%;z-index:-3;background:radial-gradient(circle at 8% 6%,#0ea5e970,transparent 30%),radial-gradient(circle at 86% 12%,#7c3aed70,transparent 32%),radial-gradient(circle at 70% 80%,#14b8a660,transparent 34%);filter:blur(18px);animation:aurora 18s ease-in-out infinite alternate}.grid{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(ellipse at top,#000,transparent 72%)}@keyframes aurora{to{transform:translate(4vw,4vh) scale(1.05)}}.shell{max-width:1520px;margin:auto;padding:24px clamp(12px,3vw,42px) 56px}.hero{border:1px solid var(--line);border-radius:34px;background:linear-gradient(135deg,rgba(15,23,42,.86),rgba(7,10,22,.64));box-shadow:0 28px 90px #0009;padding:30px clamp(20px,4vw,48px);backdrop-filter:blur(22px);overflow:hidden}.kicker{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--cyan);background:rgba(255,255,255,.06);font:900 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.13em}.spark{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 24px var(--cyan)}h1{font-size:clamp(34px,5.5vw,74px);line-height:.96;letter-spacing:-.07em;margin:18px 0 10px}.grad{background:linear-gradient(90deg,#fff,#a5f3fc 35%,#ddd6fe 75%,#fecdd3);-webkit-background-clip:text;color:transparent}.lead{max-width:1060px;color:var(--soft);font-size:clamp(15px,1.5vw,19px)}.flowTop{position:sticky;top:10px;z-index:30;margin-top:18px;border:1px solid var(--line);border-radius:26px;background:rgba(7,10,22,.72);backdrop-filter:blur(22px);box-shadow:0 18px 60px #0007;padding:12px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:0 4px 10px}.label{font:950 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}.phases{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:10px;overflow:auto}.phaseBtn{position:relative;text-align:left;border:1px solid rgba(255,255,255,.09);border-radius:19px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));color:var(--ink);padding:13px;cursor:pointer;transition:.22s}.phaseBtn:hover{transform:translateY(-3px);border-color:rgba(103,232,249,.35)}.phaseBtn.active{background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(124,58,237,.20));border-color:rgba(103,232,249,.62);box-shadow:0 18px 50px rgba(14,165,233,.18)}.num{color:var(--cyan);font:950 12px ui-monospace,monospace}.lane{margin-top:4px;color:var(--muted);font:850 10px ui-monospace,monospace;text-transform:uppercase}.ptitle{margin-top:7px;font-weight:900;line-height:1.2}.main{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:18px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(15,23,42,.78),rgba(9,13,25,.73));box-shadow:0 28px 90px #0008;backdrop-filter:blur(18px);padding:19px;min-width:0;overflow:hidden;animation:rise .26s ease both}.panel h2{font-size:clamp(25px,3vw,44px);line-height:1;margin:8px 0 10px;letter-spacing:-.045em}.summary{color:var(--soft);font-size:16px}.workItems{display:grid;gap:10px;margin-top:14px}.work{border:1px solid rgba(255,255,255,.09);border-radius:20px;background:rgba(255,255,255,.052);padding:14px;cursor:pointer;transition:.22s}.work:hover{transform:translateX(4px);border-color:rgba(192,132,252,.38)}.work.active{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(14,165,233,.12));border-color:rgba(192,132,252,.58);box-shadow:0 18px 55px rgba(124,58,237,.16)}.workTop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.code{font:950 11px ui-monospace,monospace;color:#071018;background:linear-gradient(90deg,var(--cyan),#bfdbfe);border-radius:8px;padding:4px 7px}.owner{font-size:12px;color:var(--muted);font-weight:800}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}.card{border:1px solid rgba(255,255,255,.09);border-radius:20px;background:rgba(255,255,255,.052);padding:14px}.card h3{margin:0 0 8px;font:950 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan)}.input h3{color:var(--blue)}.output h3{color:var(--green)}.risk h3{color:var(--rose)}.law h3{color:var(--amber)}.line{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.075);color:#e8eef8;overflow-wrap:anywhere}.line:last-child{border-bottom:0}.lawItem{border:1px solid rgba(255,255,255,.09);border-radius:18px;background:rgba(255,255,255,.045);padding:12px;margin-top:10px}.lawTop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.doc{font:900 11px ui-monospace,monospace;color:#03121a;background:linear-gradient(90deg,var(--amber),#a7f3d0);padding:5px 8px;border-radius:9px}.art{font-size:12px;color:var(--soft);font-weight:850}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.chip b{color:var(--ink)}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:1080px){.main{grid-template-columns:1fr}.phases{grid-auto-columns:minmax(154px,1fr)}}@media(max-width:640px){.shell{padding:12px 10px 36px}.hero,.panel{border-radius:24px}.phases{grid-auto-columns:78%}.cards{grid-template-columns:1fr}}
</style></head><body><div class="grid"></div><main class="shell"><section class="hero"><div class="kicker"><span class="spark"></span>TPRE source flow · legal-linked</div><h1><span class="grad">Lưu đồ đầu tư xây dựng</span><br>dự án BĐS</h1><p class="lead">Bản này lấy PDF lưu đồ TPRE làm xương sống: các mốc I–XI, input/output nội bộ, lane nghiệp vụ và căn cứ luật liên quan theo từng mốc.</p></section><section class="flowTop"><div class="bar"><div class="label">Tầng 1 · Mốc lưu đồ</div><div class="hint">Bấm mốc để đổi công việc, input/output và căn cứ luật</div></div><div class="phases" id="phases"></div></section><section class="main"><article class="panel" id="phasePanel"></article><aside class="panel" id="detailPanel"></aside></section><section class="panel" style="margin-top:18px"><div class="label">Chú thích</div><div class="chips" id="abbr"></div></section></main><script>
let DATA,pi=0,ii=0;fetch('tpre_bds_flow.json').then(r=>r.json()).then(d=>{DATA=d;render()});
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function lines(a){return a&&a.length?a.map(x=>`<div class="line">${esc(x)}</div>`).join(''):'<div class="line">Chưa có / tùy case.</div>'}function card(t,a,cls=''){return `<div class="card ${cls}"><h3>${esc(t)}</h3>${lines(a)}</div>`}
function laws(a){return (a||[]).map(l=>`<div class="lawItem"><div class="lawTop"><span class="doc">${esc(l.doc)}</span><span class="art">${esc(l.article)}</span></div>${lines(l.points)}</div>`).join('')||'<div class="line">Chưa map căn cứ.</div>'}
function render(){let p=DATA.phases[pi];phases.innerHTML=DATA.phases.map((x,i)=>`<button class="phaseBtn ${i===pi?'active':''}" onclick="pi=${i};ii=0;render()"><div class="num">${esc(x.id)}</div><div class="lane">${esc(x.lane)}</div><div class="ptitle">${esc(x.title)}</div></button>`).join('');phasePanel.innerHTML=`<div class="label">Tầng 2 · Phase đang chọn</div><h2>${esc(p.id)} · ${esc(p.title)}</h2><p class="summary">${esc(p.summary)}</p><div class="chips"><span class="chip"><b>Lane:</b> ${esc(p.lane)}</span><span class="chip"><b>Số việc:</b> ${(p.items||[]).length}</span></div><div class="workItems">${(p.items||[]).map((it,i)=>`<div class="work ${i===ii?'active':''}" onclick="ii=${i};renderDetail()"><div class="workTop"><span class="code">${esc(it.code)}</span><span class="owner">${esc(it.owner)}</span></div><b>${esc(it.title)}</b><div class="summary" style="font-size:13px;margin-top:4px">${esc(it.summary)}</div></div>`).join('')}</div>`;renderDetail();abbr.innerHTML=Object.entries(DATA.abbreviations||{}).map(([k,v])=>`<span class="chip"><b>${esc(k)}</b>: ${esc(v)}</span>`).join('')}
function renderDetail(){let it=DATA.phases[pi].items[ii];detailPanel.innerHTML=`<div class="label">Tầng 3 · Input / Output / Luật liên quan</div><h2>${esc(it.title)}</h2><p class="summary">${esc(it.summary)}</p><div class="cards">${card('Input / hồ sơ đầu vào',it.inputs,'input')}${card('Output / mốc pháp lý',it.outputs,'output')}</div><div style="margin-top:16px"><div class="label">Căn cứ & tóm tắt nội dung văn bản</div>${laws(it.legal_basis)}</div>`}
</script></body></html>
